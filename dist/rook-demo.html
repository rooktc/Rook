<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rook × LANXIN House — AI Growth Team · Demo</title>
<style>
/* Rook demo — owner console. Token-driven, light/dark. */
/* Neutrals: white surfaces on a cool blue-grey page (light) / deep navy (dark).
   Accent hue is set by [data-palette] below — azure is the default. */
:root {
  --bg: #f4f7fc;
  --surface: #ffffff;
  --surface-2: #f8fbff;
  --ink: #0f1b2e;
  --ink-2: #48566a;
  --muted: #8390a4;
  --line: #e5ebf4;
  --line-strong: #ccd6e6;
  --accent: #2563eb;
  --accent-hover: #1d4ed8;
  --accent-ink: #ffffff;
  --accent-soft: #e8f0fe;
  --accent-soft-ink: #1d4ed8;
  --good: #0ca30c; --good-text: #027a02;
  --warn: #f59e0b; --serious: #ef7f52; --crit: #dc2f3f;
  --chart-1: #2563eb;
  --chart-grid: #e5ebf4;
  --chart-axis: #c3cede;
  --funnel-1: #93b4f6; --funnel-2: #5f8ef0; --funnel-3: #2563eb; --funnel-4: #1c4dbb; --funnel-5: #123a8f;
  --bubble-cust: #eef2fa;
  --shadow: 0 1px 2px rgba(15, 27, 46, 0.06);
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0a1120;
    --surface: #131d31;
    --surface-2: #0e1728;
    --ink: #e9f0fa;
    --ink-2: #a6b4c9;
    --muted: #6d7c93;
    --line: #223049;
    --line-strong: #33425f;
    --accent: #5b9bff;
    --accent-hover: #7db0ff;
    --accent-ink: #08111f;
    --accent-soft: #172741;
    --accent-soft-ink: #a9c8ff;
    --good: #0ca30c; --good-text: #46c246;
    --warn: #f59e0b; --serious: #ef7f52; --crit: #f2586a;
    --chart-1: #5b9bff;
    --chart-grid: #223049;
    --chart-axis: #35435e;
    --funnel-1: #9dbcff; --funnel-2: #6f9dfb; --funnel-3: #5b9bff; --funnel-4: #3f7ae6; --funnel-5: #295bb5;
    --bubble-cust: #1a2740;
    --shadow: none;
  }
}
:root[data-theme="light"] {
  --bg: #f4f7fc; --surface: #ffffff; --surface-2: #f8fbff;
  --ink: #0f1b2e; --ink-2: #48566a; --muted: #8390a4;
  --line: #e5ebf4; --line-strong: #ccd6e6;
  --accent: #2563eb; --accent-hover: #1d4ed8; --accent-ink: #ffffff;
  --accent-soft: #e8f0fe; --accent-soft-ink: #1d4ed8;
  --good: #0ca30c; --good-text: #027a02;
  --warn: #f59e0b; --serious: #ef7f52; --crit: #dc2f3f;
  --chart-1: #2563eb; --chart-grid: #e5ebf4; --chart-axis: #c3cede;
  --funnel-1: #93b4f6; --funnel-2: #5f8ef0; --funnel-3: #2563eb; --funnel-4: #1c4dbb; --funnel-5: #123a8f;
  --bubble-cust: #eef2fa; --shadow: 0 1px 2px rgba(15,27,46,0.06);
}
:root[data-theme="dark"] {
  --bg: #0a1120; --surface: #131d31; --surface-2: #0e1728;
  --ink: #e9f0fa; --ink-2: #a6b4c9; --muted: #6d7c93;
  --line: #223049; --line-strong: #33425f;
  --accent: #5b9bff; --accent-hover: #7db0ff; --accent-ink: #08111f;
  --accent-soft: #172741; --accent-soft-ink: #a9c8ff;
  --good: #0ca30c; --good-text: #46c246;
  --warn: #f59e0b; --serious: #ef7f52; --crit: #f2586a;
  --chart-1: #5b9bff; --chart-grid: #223049; --chart-axis: #35435e;
  --funnel-1: #9dbcff; --funnel-2: #6f9dfb; --funnel-3: #5b9bff; --funnel-4: #3f7ae6; --funnel-5: #295bb5;
  --bubble-cust: #1a2740; --shadow: none;
}
/* ---- Palette overrides (accent hue only; azure is the base default) ---- */
:root[data-palette="indigo"] {
  --accent: #4f46e5; --accent-hover: #4338ca; --accent-ink: #ffffff;
  --accent-soft: #ecebfd; --accent-soft-ink: #4338ca;
  --chart-1: #4f46e5;
  --funnel-1: #b3aef5; --funnel-2: #8b83f0; --funnel-3: #4f46e5; --funnel-4: #3f37bf; --funnel-5: #2c2790;
}
:root[data-palette="sky"] {
  --accent: #0284c7; --accent-hover: #0369a1; --accent-ink: #ffffff;
  --accent-soft: #e0f2fe; --accent-soft-ink: #075985;
  --chart-1: #0284c7;
  --funnel-1: #8fd3f4; --funnel-2: #4bb6ea; --funnel-3: #0284c7; --funnel-4: #036aa1; --funnel-5: #064e75;
}
@media (prefers-color-scheme: dark) {
  :root[data-palette="indigo"]:not([data-theme="light"]) {
    --accent: #8b83f0; --accent-hover: #a29bf5; --accent-ink: #0a0f1f;
    --accent-soft: #211f42; --accent-soft-ink: #b9b3f7;
    --chart-1: #8b83f0;
    --funnel-1: #b7b1f5; --funnel-2: #9a92f2; --funnel-3: #8b83f0; --funnel-4: #6d64d8; --funnel-5: #4b43a8;
  }
  :root[data-palette="sky"]:not([data-theme="light"]) {
    --accent: #38bdf8; --accent-hover: #5fccfa; --accent-ink: #06131f;
    --accent-soft: #0c2c40; --accent-soft-ink: #a5ddfb;
    --chart-1: #38bdf8;
    --funnel-1: #7fd4f7; --funnel-2: #54c4f4; --funnel-3: #38bdf8; --funnel-4: #22a0dc; --funnel-5: #1f7ba8;
  }
}
:root[data-theme="dark"][data-palette="indigo"] {
  --accent: #8b83f0; --accent-hover: #a29bf5; --accent-ink: #0a0f1f;
  --accent-soft: #211f42; --accent-soft-ink: #b9b3f7;
  --chart-1: #8b83f0;
  --funnel-1: #b7b1f5; --funnel-2: #9a92f2; --funnel-3: #8b83f0; --funnel-4: #6d64d8; --funnel-5: #4b43a8;
}
:root[data-theme="dark"][data-palette="sky"] {
  --accent: #38bdf8; --accent-hover: #5fccfa; --accent-ink: #06131f;
  --accent-soft: #0c2c40; --accent-soft-ink: #a5ddfb;
  --chart-1: #38bdf8;
  --funnel-1: #7fd4f7; --funnel-2: #54c4f4; --funnel-3: #38bdf8; --funnel-4: #22a0dc; --funnel-5: #1f7ba8;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 14px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; cursor: pointer; }
a { color: var(--accent); }

.shell { display: grid; grid-template-columns: 218px 1fr; min-height: 100vh; }

/* ---- sidebar ---- */
.side {
  border-right: 1px solid var(--line);
  padding: 18px 12px;
  position: sticky; top: 0; height: 100vh;
  display: flex; flex-direction: column; gap: 4px;
  background: var(--surface-2);
}
.logo { padding: 4px 10px 14px; }
.logo-row { display: flex; align-items: center; gap: 7px; }
.logo .mark { color: var(--accent); font-size: 17px; line-height: 1; }
.logo b { font-size: 19px; letter-spacing: -0.02em; line-height: 1.2; }
.logo-tag { display: block; font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.09em; margin-top: 2px; padding-left: 24px; }
.nav-btn {
  display: flex; align-items: center; gap: 10px;
  width: 100%; text-align: left;
  padding: 8px 10px; border: 0; border-radius: 8px;
  background: transparent; color: var(--ink-2);
}
.nav-btn svg { flex: none; opacity: 0.75; }
.nav-btn:hover { background: var(--accent-soft); color: var(--accent-soft-ink); }
.nav-btn.on { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.nav-btn.on svg { opacity: 1; }
.nav-btn .bdg { margin-left: auto; font-size: 11px; background: var(--crit); color: #fff; border-radius: 99px; padding: 0 6px; line-height: 17px; }
.nav-btn.on .bdg { background: var(--accent-ink); color: var(--accent); }
.side-foot { margin-top: auto; padding: 14px 10px 4px; font-size: 11.5px; color: var(--muted); line-height: 1.5; border-top: 1px solid var(--line); }
.reset-link { display: inline-block; margin-top: 8px; border: 0; background: none; padding: 0; font-size: 11.5px; color: var(--accent); cursor: pointer; }
.reset-link:hover { text-decoration: underline; }
.empty-cell { text-align: center; color: var(--muted); padding: 22px 10px !important; font-size: 13px; }

/* ---- main ---- */
.main { min-width: 0; padding: 0 26px 90px; }
.topbar {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 16px 0 14px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 20px;
}
.topbar h1 { font-size: 16.5px; margin: 0; font-weight: 650; letter-spacing: -0.01em; white-space: nowrap; }
.topbar .sub { color: var(--muted); font-size: 12.5px; }
.top-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; margin-left: auto; }
.chip {
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em;
  padding: 3px 9px; border-radius: 99px; font-weight: 600;
  white-space: nowrap; font-variant-numeric: tabular-nums;
}
.chip.sim { background: var(--warn); color: #402b00; }
.chip.time { background: var(--accent-soft); color: var(--accent-soft-ink); }
.spacer { flex: 1; }

h2.sec { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 26px 0 10px; font-weight: 650; }
h2.sec:first-child { margin-top: 0; }

.card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 16px 18px;
}
.grid { display: grid; gap: 12px; }
.grid.c2 { grid-template-columns: 1fr 1fr; }
/* allow grid/flex children to shrink below their content so nowrap text
   ellipsizes and wide media scales instead of forcing horizontal scroll */
.grid > *, .kpi-row > *, .stat-row > *, .card { min-width: 0; }
#view svg { max-width: 100%; height: auto; }
.tbl-wrap { max-width: 100%; }
.grid.c3 { grid-template-columns: repeat(3, 1fr); }

/* ---- today ---- */
.brief { border-left: 3px solid var(--accent); }
.brief h3 { margin: 0 0 6px; font-size: 15.5px; }
.brief p { margin: 0; color: var(--ink-2); max-width: 62ch; }
.stat-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
.stat-row.s6 { grid-template-columns: repeat(6, 1fr); }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; box-shadow: var(--shadow); }
.stat b { display: block; font-size: 22px; font-weight: 650; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }
.opp { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.opp + .opp { margin-top: 8px; }
.opp .stripe { flex: none; width: 4px; align-self: stretch; border-radius: 2px; }
.opp.critical .stripe { background: var(--crit); }
.opp.decision .stripe { background: var(--warn); }
.opp.watch .stripe { background: var(--chart-1); }
.opp.suggestion .stripe { background: var(--good); }
.opp .who { font-weight: 650; }
.opp .why { color: var(--ink-2); font-size: 13px; max-width: 68ch; }
.opp .val { margin-left: auto; flex: none; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
.opp .go { flex: none; align-self: center; }

.appr { display: flex; gap: 12px; align-items: center; padding: 11px 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.appr + .appr { margin-top: 8px; }
.appr .k { flex: none; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.07em; font-weight: 700; color: var(--accent-soft-ink); background: var(--accent-soft); border-radius: 5px; padding: 3px 7px; }
.appr .t b { font-weight: 650; display: block; }
.appr .t span { font-size: 12.5px; color: var(--ink-2); }
.appr .act { margin-left: auto; flex: none; display: flex; gap: 6px; }

.btn {
  border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink);
  border-radius: 8px; padding: 6px 12px; font-size: 13px; font-weight: 550;
  white-space: nowrap;
  transition: border-color 0.15s, color 0.15s, background 0.15s, transform 0.1s;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn:active { transform: translateY(1px); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.pri:hover { background: var(--accent-hover); border-color: var(--accent-hover); color: var(--accent-ink); }
.btn.sm { padding: 4px 10px; font-size: 12.5px; }
.btn[disabled] { opacity: 0.55; cursor: default; transform: none; }
@media (prefers-reduced-motion: reduce) { .btn { transition: none; } .btn:active { transform: none; } }

/* ---- inbox ---- */
.inbox { display: grid; grid-template-columns: 290px minmax(0, 1fr) 265px; gap: 14px; align-items: start; }
.convo-list { display: flex; flex-direction: column; gap: 6px; }
.convo {
  text-align: left; border: 1px solid var(--line); background: var(--surface);
  border-radius: var(--radius); padding: 10px 12px; width: 100%;
  display: block; color: inherit;
}
.convo { transition: border-color 0.15s; }
.convo:hover { border-color: var(--accent); }
.convo.on { border-color: var(--accent); background: var(--accent-soft); }
.convo .r1 { display: flex; gap: 8px; align-items: baseline; }
.convo .r1 b { font-weight: 650; font-size: 13.5px; }
.convo .r1 time { margin-left: auto; font-size: 11px; color: var(--muted); flex: none; }
.convo .pv { font-size: 12.5px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.convo .r2 { display: flex; gap: 6px; margin-top: 6px; align-items: center; }
.dot { width: 7px; height: 7px; border-radius: 99px; display: inline-block; }
.tagchip { font-size: 10.5px; padding: 1px 7px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-2); max-width: 100%; overflow-wrap: anywhere; }
.tagchip.ai { background: var(--accent-soft); border-color: transparent; color: var(--accent-soft-ink); font-weight: 600; }
.tagchip.human { background: var(--warn); border-color: transparent; color: #402b00; font-weight: 600; }
.tagchip.esc { background: var(--crit); border-color: transparent; color: #fff; font-weight: 600; }

.thread { display: flex; flex-direction: column; min-height: 480px; }
.thread-head { display: flex; align-items: center; gap: 8px; row-gap: 6px; padding-bottom: 10px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.thread-head b { font-size: 15px; white-space: nowrap; }
.thread-head .sub { color: var(--muted); font-size: 12px; }
.thread-head .btn.sm { padding: 4px 8px; font-size: 12px; }
.msgs { flex: 1; display: flex; flex-direction: column; gap: 10px; padding: 16px 2px; }
.msg { max-width: 78%; padding: 8px 12px; border-radius: 14px; position: relative; }
.msg.cust { align-self: flex-start; background: var(--bubble-cust); border-bottom-left-radius: 4px; }
.msg.ai, .msg.staff { align-self: flex-end; background: var(--accent-soft); color: var(--ink); border-bottom-right-radius: 4px; }
.msg .meta { display: block; font-size: 10.5px; color: var(--muted); margin-top: 4px; }
.msg .cite { display: inline-block; font-size: 10.5px; margin-top: 6px; padding: 2px 8px; border-radius: 99px; border: 1px dashed var(--accent); color: var(--accent-soft-ink); }
.cite-k { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; margin-right: 6px; opacity: 0.75; }
.msg.sys { align-self: center; max-width: 92%; background: transparent; border: 1px dashed var(--line-strong); color: var(--muted); font-size: 11.5px; text-align: center; border-radius: 8px; }
.typing { align-self: flex-end; background: var(--accent-soft); border-radius: 14px; padding: 10px 14px; }
.typing i { display: inline-block; width: 5px; height: 5px; margin: 0 1.5px; background: var(--accent); border-radius: 99px; animation: blink 1s infinite; }
.typing i:nth-child(2) { animation-delay: 0.18s; } .typing i:nth-child(3) { animation-delay: 0.36s; }
@keyframes blink { 0%, 70%, 100% { opacity: 0.25; } 35% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .typing i { animation: none; } }

.ctx .card + .card { margin-top: 10px; }
.ctx h4 { margin: 0 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 12.5px; }
.kv dt { color: var(--muted); margin: 0; }
.kv dd { margin: 0; font-weight: 550; }
.score-pill { font-size: 20px; font-weight: 650; font-variant-numeric: tabular-nums; }
.handoff { border-left: 3px solid var(--warn); }
.handoff p { margin: 0; font-size: 12.5px; color: var(--ink-2); }
.nextact { border-left: 3px solid var(--accent); }
.nextact p { margin: 0; font-size: 12.5px; color: var(--ink-2); }

/* ---- customers ---- */
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.fbtn { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 99px; padding: 4px 12px; font-size: 12.5px; color: var(--ink-2); }
.fbtn.on { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 600; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 650; padding: 8px 10px; border-bottom: 1px solid var(--line-strong); }
.tbl td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl tr.rowbtn { cursor: pointer; }
.tbl tr.rowbtn:hover td { background: var(--surface-2); }
.tbl .num { text-align: right; font-variant-numeric: tabular-nums; }
.tbl-wrap { overflow-x: auto; }
.lc { font-size: 11px; font-weight: 650; padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
.lc.Active { background: var(--accent-soft); color: var(--accent-soft-ink); }
.lc.VIP { background: var(--funnel-4); color: #fff; }
.lc.Dormant { background: var(--surface-2); border: 1px solid var(--line-strong); color: var(--muted); }
.lc.Converted { background: var(--accent-soft); color: var(--accent-soft-ink); }
.lc.Evaluating { background: var(--warn); color: #402b00; }
.lc.churn { background: var(--crit); color: #fff; }
.lc.lead { background: var(--surface-2); border: 1px solid var(--line-strong); color: var(--ink-2); }
.cust-detail .timeline { list-style: none; margin: 8px 0 0; padding: 0; }
.cust-detail .timeline li { position: relative; padding: 0 0 14px 22px; border-left: 2px solid var(--line); margin-left: 6px; }
.cust-detail .timeline li::before { content: ""; position: absolute; left: -6px; top: 3px; width: 10px; height: 10px; border-radius: 99px; background: var(--accent); border: 2px solid var(--surface); }
.cust-detail .timeline time { font-size: 11px; color: var(--muted); display: block; }

/* ---- marketing ---- */
.camp { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); padding: 16px 18px; }
.camp + .camp { margin-top: 10px; }
.camp .head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.camp .head b { font-size: 14.5px; font-weight: 650; }
.camp .status { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; padding: 2px 9px; border-radius: 99px; }
.status.pending { background: var(--warn); color: #402b00; }
.status.scheduled { background: var(--accent-soft); color: var(--accent-soft-ink); }
.status.completed { background: var(--surface-2); border: 1px solid var(--line-strong); color: var(--muted); }
.status.approved { background: var(--good); color: #fff; }
.camp .row { display: grid; grid-template-columns: 110px 1fr; gap: 3px 14px; font-size: 13px; margin-top: 10px; }
.camp .row dt { color: var(--muted); }
.camp .row dd { margin: 0; color: var(--ink-2); }
.camp .copy { font-style: italic; background: var(--surface-2); border: 1px dashed var(--line-strong); border-radius: 8px; padding: 8px 12px; margin-top: 10px; font-size: 13px; color: var(--ink-2); max-width: 68ch; }
.est { display: flex; gap: 18px; margin-top: 12px; flex-wrap: wrap; }
.est div b { display: block; font-size: 16px; font-variant-numeric: tabular-nums; }
.est div span { font-size: 11.5px; color: var(--muted); }
.camp .actions { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }

/* ---- reputation ---- */
.rev { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); padding: 14px 16px; }
.rev + .rev { margin-top: 10px; }
.rev .head { display: flex; gap: 10px; align-items: baseline; }
.rev .stars { color: var(--warn); letter-spacing: 2px; font-size: 13px; }
.rev.neg .stars { color: var(--crit); }
.rev p.txt { margin: 8px 0; color: var(--ink-2); max-width: 68ch; }
.rev .reply { border-left: 3px solid var(--accent); padding: 8px 12px; background: var(--surface-2); border-radius: 0 8px 8px 0; font-size: 13px; color: var(--ink-2); max-width: 66ch; }
.rev .reply .lbl { display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin-bottom: 3px; font-weight: 700; }
.theme-row { display: flex; align-items: center; gap: 10px; font-size: 13px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.theme-row:last-child { border-bottom: 0; }
.theme-row .bar { height: 8px; border-radius: 4px; background: var(--chart-1); }
.theme-row.warn .bar { background: var(--warn); }
.theme-row.bad .bar { background: var(--crit); }
.theme-row .n { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }

/* ---- brain ---- */
.kb { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); padding: 13px 16px; }
.kb + .kb { margin-top: 8px; }
.kb .head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.kb .head b { font-weight: 650; }
.kb .head .cat { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.kb .head .cites { margin-left: auto; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
.kb p { margin: 6px 0 0; font-size: 13px; color: var(--ink-2); max-width: 72ch; }
.kb .meta { font-size: 11.5px; color: var(--muted); margin-top: 6px; }
.lock { font-size: 10.5px; font-weight: 700; color: var(--serious); text-transform: uppercase; letter-spacing: 0.05em; }
.gap { border-left: 3px solid var(--warn); }
.gap b { font-weight: 650; }
.gap p { margin: 3px 0 0; font-size: 12.5px; color: var(--ink-2); }

/* ---- insights / charts ---- */
.chart-card h3 { margin: 0 0 2px; font-size: 13.5px; font-weight: 650; }
.chart-card .sub { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
.viz { width: 100%; height: auto; display: block; }
.viz text { font: 10.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--muted); }
.viz .val { fill: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.viz .grid-line { stroke: var(--chart-grid); stroke-width: 1; }
.viz .axis { stroke: var(--chart-axis); stroke-width: 1; }
.tooltip {
  position: fixed; z-index: 30; pointer-events: none;
  background: var(--ink); color: var(--bg);
  font-size: 12px; padding: 5px 9px; border-radius: 7px;
  transform: translate(-50%, calc(-100% - 10px));
  white-space: nowrap; display: none;
}
.dtable { margin-top: 8px; }
.dtable summary { font-size: 11.5px; color: var(--muted); cursor: pointer; user-select: none; }
.dtable summary:hover { color: var(--accent); }
.dtable .tbl-wrap { max-height: 260px; overflow-y: auto; margin-top: 6px; border: 1px solid var(--line); border-radius: 8px; }
.dtable .tbl td, .dtable .tbl th { padding: 5px 10px; font-size: 12px; }
.viz .drillable { cursor: pointer; }
.viz .drillable:hover { opacity: 0.85; }
.strategy li { margin-bottom: 8px; color: var(--ink-2); max-width: 72ch; }
.strategy li::marker { color: var(--accent); }
.kpi-delta { font-size: 11.5px; color: var(--good-text); }

/* ---- task centre ---- */
.task-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.task-row:last-child { border-bottom: 0; }
.task-dot { flex: none; width: 9px; height: 9px; border-radius: 99px; background: var(--line-strong); }
.task-row.today .task-dot { background: var(--warn); }
.task-row.scheduled .task-dot { background: var(--chart-1); }
.task-row.done .task-dot { background: var(--good); }
.task-row.done .task-title { color: var(--muted); text-decoration: line-through; }
.task-title { flex: 1; min-width: 0; }
.task-meta { flex: none; color: var(--muted); font-size: 12px; white-space: nowrap; }

/* ---- social ---- */
.cal-row { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.cal-row:last-child { border-bottom: 0; }
.cal-day { flex: none; width: 58px; font-weight: 650; font-size: 12.5px; }
.cal-day em { display: block; font-style: normal; font-weight: 400; font-size: 11px; color: var(--muted); }
.cal-body { flex: 1; min-width: 0; }
.cal-body b { display: block; font-weight: 600; font-size: 13px; }
.cal-body span { font-size: 11.5px; color: var(--muted); }
.tagchip.st-linked { background: var(--funnel-1); border-color: transparent; color: #0d366b; font-weight: 600; }
.tagchip.st-good { background: var(--good); border-color: transparent; color: #fff; font-weight: 600; }
.int-row { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.int-row:last-child { border-bottom: 0; }
.int-row > div { flex: 1; min-width: 0; }
.int-text { font-size: 13px; color: var(--ink-2); margin-top: 2px; }
.int-out { font-size: 12px; color: var(--accent-soft-ink); margin-top: 2px; }
.int-row .tagchip { flex: none; }

/* ---- trust / audit ---- */
.audit-row { display: flex; align-items: baseline; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.audit-row:last-child { border-bottom: 0; }
.audit-t { flex: none; width: 84px; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.audit-text { flex: 1; min-width: 0; font-size: 13px; }
.audit-row .tagchip { flex: none; }

/* ---- industry switcher ---- */
.seg { display: flex; gap: 3px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 99px; padding: 3px; }
.seg button { border: 0; background: none; border-radius: 99px; padding: 4px 12px; font-size: 12px; color: var(--ink-2); font-weight: 550; }
.seg button.on { background: var(--ink); color: var(--bg); font-weight: 650; }
.seg.sm button { padding: 3px 10px; font-size: 11.5px; }
/* palette (colour theme) picker */
.seg.pal { padding: 3px 4px; gap: 4px; }
.pal-dot { padding: 3px !important; display: inline-flex; align-items: center; justify-content: center; }
.pal-dot span { width: 15px; height: 15px; border-radius: 99px; display: block; box-shadow: inset 0 0 0 1px rgba(15,27,46,0.14); }
.pal-dot.on { box-shadow: inset 0 0 0 2px var(--ink); }
.pal-dot.on span { box-shadow: inset 0 0 0 1px rgba(255,255,255,0.7); }
.pal-azure span { background: #2563eb; }
.pal-indigo span { background: #4f46e5; }
.pal-sky span { background: #0284c7; }

/* ---- home: AI advisor hero ---- */
.advisor { background: linear-gradient(180deg, var(--accent-soft), var(--surface)); border-color: var(--accent); }
.advisor-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--accent-soft-ink); margin-bottom: 8px; }
.advisor-dot { width: 8px; height: 8px; border-radius: 99px; background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.advisor-summary { margin: 0; font-size: 15px; line-height: 1.55; color: var(--ink); max-width: 74ch; }
.advisor-foot { display: flex; align-items: center; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
.advisor-metric b { font-size: 18px; color: var(--good-text); font-variant-numeric: tabular-nums; }
.advisor-metric span { font-size: 12px; color: var(--muted); }
.advisor-foot .btn { margin-left: auto; }

/* ---- home: clickable KPI row ---- */
.kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 14px 0; }
.kpi-card { position: relative; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); cursor: pointer; transition: border-color 0.15s, transform 0.1s; display: flex; flex-direction: column; gap: 3px; }
.kpi-card:hover { border-color: var(--accent); }
.kpi-card:active { transform: translateY(1px); }
.kpi-label { font-size: 12px; color: var(--muted); }
.kpi-val { font-size: 23px; font-weight: 650; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.kpi-go { position: absolute; top: 12px; right: 14px; color: var(--muted); opacity: 0; transition: opacity 0.15s; }
.kpi-card:hover .kpi-go { opacity: 1; color: var(--accent); }

/* ---- home: AI task cards ---- */
.tcard { text-align: left; background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--chart-1); border-radius: var(--radius); padding: 12px 15px; cursor: pointer; display: flex; flex-direction: column; gap: 3px; transition: border-color 0.15s; box-shadow: var(--shadow); }
.tcard:hover { border-color: var(--accent); border-left-color: var(--chart-1); }
.tcard.neg { border-left-color: var(--crit); }
.tcard-k { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.tcard b { font-size: 14px; }
.tcard-pv { font-size: 12.5px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tcard-cta { font-size: 12px; color: var(--accent); font-weight: 600; margin-top: 2px; }

/* ---- tabs (operations) ---- */
.tabbtns { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
.tabbtn { border: 0; background: none; padding: 8px 16px; font-size: 13.5px; font-weight: 600; color: var(--ink-2); border-bottom: 2px solid transparent; margin-bottom: -1px; cursor: pointer; }
.tabbtn:hover { color: var(--accent); }
.tabbtn.on { color: var(--accent); border-bottom-color: var(--accent); }

/* ---- staff shift grid ---- */
.tbl.shifts td, .tbl.shifts th { text-align: center; }
.tbl.shifts td:first-child, .tbl.shifts th:first-child { text-align: left; }
.shift-on { color: var(--accent); font-size: 13px; }
.shift-off { color: var(--line-strong); }

/* ---- marketing: suggestions ---- */
.sec-sub { font-size: 12.5px; color: var(--muted); margin: -6px 0 10px; }
.sugg-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.sugg-row:last-child { border-bottom: 0; }
.sugg-dot { flex: none; width: 8px; height: 8px; border-radius: 99px; background: var(--chart-1); }
.sugg-row.bad .sugg-dot { background: var(--crit); }
.sugg-text { flex: 1; font-size: 13.5px; }
.sugg-row .btn { flex: none; }

/* ---- marketing: publish wizard ---- */
.wizard { border-top: 3px solid var(--accent); }
.wiz-sub { margin: 0 0 14px; font-size: 12.5px; color: var(--muted); }
.wiz-field { margin-bottom: 14px; }
.wiz-field > label { display: block; font-size: 12px; font-weight: 650; margin-bottom: 6px; }
.wiz-field > label span { font-weight: 400; color: var(--muted); }
.wchips { display: flex; flex-wrap: wrap; gap: 6px; }
.wchip { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 99px; padding: 5px 13px; font-size: 12.5px; color: var(--ink-2); cursor: pointer; transition: all 0.12s; }
.wchip:hover { border-color: var(--accent); }
.wchip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.wiz-textarea { width: 100%; box-sizing: border-box; border: 1px solid var(--line-strong); border-radius: 8px; padding: 10px 12px; font: inherit; font-size: 13.5px; line-height: 1.5; color: var(--ink); background: var(--surface-2); resize: vertical; }
.wiz-textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
.wiz-row { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
.wiz-poster { font-size: 11px; color: var(--accent-soft-ink); background: var(--accent-soft); border-radius: 99px; padding: 3px 10px; font-weight: 600; }
.wiz-actions { margin-top: 4px; }
.wizard.done { text-align: center; border-top-color: var(--good); }
.wiz-done-ic { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 99px; background: var(--good); color: #fff; font-size: 20px; }
.wiz-preview { font-style: italic; background: var(--surface-2); border: 1px dashed var(--line-strong); border-radius: 8px; padding: 10px 14px; font-size: 13px; color: var(--ink-2); max-width: 62ch; margin: 0 auto; text-align: left; }

/* ---- marketing: published-content reveal ---- */
.camp-published { margin-top: 10px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.cp-head { background: var(--surface-2); padding: 7px 12px; font-size: 11.5px; color: var(--muted); border-bottom: 1px solid var(--line); }
.cp-body { padding: 12px 14px; font-size: 13.5px; color: var(--ink); line-height: 1.55; }

/* ---- bookings page ---- */
.linklike { border: 0; background: none; padding: 0; color: var(--accent); font: inherit; font-weight: 650; cursor: pointer; }
.linklike:hover { text-decoration: underline; }

/* ---- follow-up page ---- */
.fu-row { display: flex; align-items: flex-start; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.fu-row:last-child { border-bottom: 0; }
.fu-dot { flex: none; width: 8px; height: 8px; border-radius: 99px; background: var(--warn); margin-top: 5px; }
.fu-body { flex: 1; min-width: 0; }
.fu-reason { font-size: 13px; color: var(--ink-2); margin-top: 3px; max-width: 72ch; }
.fu-due { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
.fu-row .btn { flex: none; }

/* ---- reputation: platform aggregate ---- */
.plat-pill { font-size: 12px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 99px; padding: 3px 11px; color: var(--ink-2); font-variant-numeric: tabular-nums; }

/* ---- wizard: poster selection ---- */
.posters { display: flex; gap: 10px; flex-wrap: wrap; }
.poster-card { position: relative; width: 130px; height: 84px; border-radius: 10px; border: 2px solid var(--line-strong); cursor: pointer; text-align: left; padding: 9px 10px; display: flex; flex-direction: column; justify-content: flex-end; color: #fff; overflow: hidden; background: linear-gradient(135deg, hsl(var(--ph), 55%, 42%), hsl(var(--ph), 60%, 30%)); transition: transform 0.1s, box-shadow 0.15s; }
.poster-card:hover { transform: translateY(-1px); }
.poster-card.sel { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.poster-card b { font-size: 12.5px; line-height: 1.2; text-shadow: 0 1px 3px rgba(0,0,0,0.35); }
.poster-sub { font-size: 10.5px; opacity: 0.9; text-shadow: 0 1px 2px rgba(0,0,0,0.3); }
.poster-tag { position: absolute; top: 7px; left: 9px; font-size: 9px; text-transform: uppercase; letter-spacing: 0.06em; background: rgba(0,0,0,0.28); padding: 2px 6px; border-radius: 99px; }
.poster-check { position: absolute; top: 6px; right: 7px; width: 18px; height: 18px; border-radius: 99px; background: var(--accent); color: #fff; font-size: 11px; display: flex; align-items: center; justify-content: center; }
.wiz-final { display: flex; gap: 14px; align-items: stretch; justify-content: center; flex-wrap: wrap; }
.wiz-final .poster-card { width: 150px; height: 96px; cursor: default; }
.wiz-final .wiz-preview { flex: 1; min-width: 240px; margin: 0; }

/* ---- setup / onboarding ---- */
.ob-stage { position: relative; opacity: 0.55; transition: opacity 0.3s; }
.ob-stage.on { opacity: 1; }
.ob-stage h3 { margin: 0 0 2px; font-size: 14.5px; padding-right: 40px; }
.ob-stage .ob-sub { margin: 0 0 10px; font-size: 12.5px; color: var(--ink-2); max-width: 56ch; }
.ob-num {
  position: absolute; top: 14px; right: 16px;
  width: 26px; height: 26px; border-radius: 99px;
  display: flex; align-items: center; justify-content: center;
  background: var(--accent-soft); color: var(--accent-soft-ink); font-weight: 700; font-size: 13px;
}
.ob-stage.on .ob-num { background: var(--accent); color: var(--accent-ink); }
.ob-file, .ob-item { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.ob-file:last-child, .ob-item:last-child { border-bottom: 0; }
.ob-file b { display: block; font-weight: 600; }
.ob-file span:not(.ob-check) { font-size: 12px; color: var(--muted); }
.ob-file div span { display: block; }
.ob-check {
  flex: none; width: 18px; height: 18px; border-radius: 99px;
  border: 1.5px solid var(--line-strong);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; color: transparent;
}
.ob-file.done .ob-check, .ob-item .ob-check { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.ob-cat { margin-left: auto; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }

/* ---- document upload ---- */
.upload-card { margin-top: 14px; }
.up-head { margin: 0 0 10px; font-size: 14.5px; }
.dropzone {
  display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px;
  padding: 26px 20px; border: 1.5px dashed var(--line-strong); border-radius: var(--radius);
  background: var(--surface-2); cursor: pointer; transition: border-color 0.15s, background 0.15s;
}
.dropzone:hover { border-color: var(--accent); }
.dropzone.drag { border-color: var(--accent); background: var(--accent-soft); }
.dropzone .dz-icon {
  width: 34px; height: 34px; border-radius: 99px; background: var(--accent-soft); color: var(--accent);
  display: flex; align-items: center; justify-content: center; font-size: 18px; margin-bottom: 2px;
}
.dropzone b { font-size: 13.5px; color: var(--ink); }
.dropzone .dz-hint { font-size: 12px; color: var(--muted); max-width: 52ch; }
.dz-empty { margin: 12px 0 0; font-size: 12.5px; color: var(--ink-2); }
.up-list { margin-top: 12px; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.up-row { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-bottom: 1px solid var(--line); font-size: 13px; }
.up-row:last-child { border-bottom: 0; }
.up-doc { color: var(--accent); font-size: 13px; }
.up-name { font-weight: 550; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.up-size { margin-left: auto; font-size: 11.5px; color: var(--muted); }
.up-x { border: 0; background: none; color: var(--muted); font-size: 12px; cursor: pointer; padding: 2px 4px; border-radius: 6px; }
.up-x:hover { color: var(--crit); background: var(--surface-2); }
.up-actions { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
.up-count { font-size: 12px; color: var(--ink-2); }
.sec-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 18px 0 10px; }
.sec-row .sec { margin: 0; }

/* ---- personalisation form ---- */
.brand-card { margin-top: 14px; }
.brand-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.brand-grid label { display: flex; flex-direction: column; gap: 5px; font-size: 12px; font-weight: 600; color: var(--ink-2); }
.brand-grid input {
  font: inherit; font-weight: 500; color: var(--ink); background: var(--surface-2);
  border: 1px solid var(--line-strong); border-radius: 8px; padding: 8px 10px;
}
.brand-grid input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
@media (max-width: 760px) { .brand-grid { grid-template-columns: 1fr; } }

/* ---- ask the assistant (grounded Q&A tester) ---- */
.ask-ex { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 12px; }
.chip-btn {
  border: 1px solid var(--line-strong); background: var(--surface-2); color: var(--ink-2);
  border-radius: 99px; padding: 5px 12px; font: inherit; font-size: 12px; cursor: pointer;
}
.chip-btn:hover { border-color: var(--accent); color: var(--accent); }
.ask-log { max-height: 340px; overflow-y: auto; padding: 4px 2px; margin-bottom: 12px; gap: 8px; }
.ask-log .msg { max-width: 82%; padding: 8px 12px; border-radius: 12px; font-size: 13px; line-height: 1.5; }
.ask-log .msg.cust { align-self: flex-end; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 3px; }
.ask-log .msg.ai { align-self: flex-start; background: var(--surface-2); border: 1px solid var(--line); border-bottom-left-radius: 3px; }
.ask-log .cite { display: inline-block; margin-top: 6px; font-size: 11px; color: var(--muted); }
.ask-log .cite-k { font-weight: 700; color: var(--accent); margin-right: 4px; }
.ask-log .cite.esc .cite-k { color: var(--warn); }
.ask-row { display: flex; gap: 10px; }
.ask-row input {
  flex: 1; font: inherit; color: var(--ink); background: var(--surface-2);
  border: 1px solid var(--line-strong); border-radius: 9px; padding: 9px 12px;
}
.ask-row input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

/* ---- PDPA / data-protection card ---- */
.pdpa-sub { margin: -4px 0 14px; font-size: 13px; color: var(--ink-2); max-width: 78ch; }
.pdpa-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 22px; }
.pdpa-row { display: flex; gap: 10px; align-items: flex-start; }

  function t(key, vars) {
    const dict = I18N[state.lang] || I18N.en;
    let str = dict[key] ?? I18N.en[key] ?? key;

  const td = (s) => {
    if (state.lang ==='en' || s == null) return s;
    const dict = window.DATA_TRX || {};
    const idx = state.lang ==='zh-Hant'? 0: 1;
    const hit = dict[s];
    if (hit) return hit[idx];
    // compound fallback: "Toby · Golden Retriever" translates part by part
    if (typeof s ==='string' && s.includes(' · ')) {
      return s.split(' · ').map((p) => { const h = dict[p]; return h? h[idx]: p; }).join(' · ');
    }
    return s;
  };

  const fmtRel = (iso) => {
    if (!iso) return t('rel.dash');
    const ms = NOW - new Date(iso);

    if (h < -0.01) {
      const dAhead = Math.round(-h / 24);
      return dAhead <= 1? t('rel.tomorrow'): t('rel.inDays', { n: dAhead });
    }
    if (h < 1) return t('rel.minAgo', { n: Math.max(1, Math.round(ms / 6e4)) });
    if (h < 22) return t('rel.hAgo', { n: Math.round(h) });
    const days = Math.round(h / 24);
    if (days <= 1) return t('rel.yesterday');
    if (days < 7) return t('rel.daysAgo', { n: days });
    if (days < 30) return t('rel.weeksAgo', { n: Math.round(days / 7) });

  // ---------- simulation ----------
  function runSimulation() {
    if (state.simRunning) return;
    state.simRunning = true;
    const token = ++state.simToken;
    const sim = D.simulation;
    state.simConvo = {
      id:'v-sim', name: sim.name, channel: sim.channel, customerLine: sim.customerLine,
      preview: t('sim.livePlaying'), time: D.merchant.now, unread: true,
      aiStatus:'ai', score: 58, intent:'Booking inquiry',
      fields: sim.fields, handoff: null, nextAction: sim.nextAction,
      messages: [],
    };
    state.convId ='v-sim';
    state.mobilePane ='thread';
    render();
    let i = 0;
    const step = () => {
      if (token!== state.simToken) return; // industry switched or replay — abandon
      const s = sim.steps[i];
      if (!s) {
        state.simRunning = false;
        state.simConvo.preview = sim.donePreview;
        state.simConvo.score = sim.doneScore;
        render();
        toast(td(sim.doneToast));
        return;
      }
      i++;
      if (s.from ==='typing') {
        state.simConvo.messages.push({ from:'typing' });
        render();
        setTimeout(() => {
          if (token!== state.simToken) return;
          state.simConvo.messages = state.simConvo.messages.filter((m) => m.from!=='typing');
          step();
        }, 1100);
        return;
      }
      setTimeout(() => {
        if (token!== state.simToken) return;
        state.simConvo.messages.push({ from: s.from, text: s.text, cite: s.cite, time: D.merchant.now });
        render();
        step();
      }, s.delay);
    };
    step();
  }

  function spendHistory(c) {
    if (!c.visits) return { rows: [], total: 0 };
    const svc = (D.services || []).find((s) => s.name === c.pref || c.pref.includes(s.name) || s.name.includes(c.pref));
    const unit = svc? svc.price: (c.ltv && c.visits? Math.round(c.ltv / c.visits): 60);
    const n = Math.min(c.visits, 5);
    const last = c.lastVisit? new Date(c.lastVisit): new Date(NOW - 20 * 864e5);
    const vary = [0, -6, 8, -4, 12];
    const rows = [];
    for (let i = 0; i < n; i++) {
      rows.push({ date: new Date(+last - i * 24 * 864e5).toISOString(), service: c.pref, amount: Math.max(20, unit + vary[i % vary.length]) });
    }
    return { rows, total: c.ltv || rows.reduce((a, r) => a + r.amount, 0) };
  }

  // ---------- Brain ----------
  // "Ask the assistant" — keyword → grounded answer + citation, else escalate.
  // Demonstrates the grounding story interactively without a live LLM.
  const ASK = {
    lanxin: [
      { kw: ['pregnan','怀孕','孕','medication','药','medical','allerg','过敏','insomnia treat','cure','治','diagnos'], aKey:'ask.l.safety', kb:'kb-safety' },
      { kw: ['member','bloom','flow','radiance','会员','會員'], aKey:'ask.l.member', kb:'kb-member' },
      { kw: ['zodiac','star sign','libra','pisces','星座','精油瓶'], aKey:'ask.l.zodiac', kb:'kb-price' },
      { kw: ['tea','点茶','點茶','茶道','ceremony'], aKey:'ask.l.tea', kb:'kb-price' },
      { kw: ['price','cost','how much','$','rate','charge','多少钱','多少錢','价格','價格','收费','收費'], aKey:'ask.l.price', kb:'kb-price' },
      { kw: ['hour','open','close','where','address','location','mrt','地址','几点','幾點','营业','營業'], aKey:'ask.l.hours', kb:'kb-arrival' },
      { kw: ['book','appointment','appt','slot','available','reserve','deposit','预约','預約','订金','訂金'], aKey:'ask.l.book', kb:'kb-fj' },
    ],
  };
  const kbTitle = (id) => { const k = D.knowledge.find((x) => x.id === id); return k? td(k.title):''; };
  function askAI(text) {
    const q = (text ||'').trim();
    if (!q) return;
    const low = q.toLowerCase();
    const hit = (ASK[state.industry] || []).find((e) => e.kw.some((k) => low.includes(k)));
    state.askLog.push(hit? { q, key: hit.aKey, kb: hit.kb }: { q, escalate: true });
    render();
  }

? `<div class="msg ai">${t('ask.fallback')}<br><span class="cite esc"><span class="cite-k">●</span> ${t('ask.escChip')}</span></div>`
: `<div class="msg ai">${t(it.key)}<br><span class="cite"><span class="cite-k">${t('msg.source')}</span> ${esc(kbTitle(it.kb))}</span></div>`;

  function uploadCard() {
    const has = state.uploads.length > 0;
    const list = has? `<div class="up-list">

: `<p class="dz-empty">${t('setup.dzEmpty')}</p>

          <p class="ob-sub">${s >= 15? esc(td(ob.live)): t('setup.waitsFor3')}</p>
          ${s >= 15? `<div style="margin-top:10px"><span class="tagchip ai">● ${t('setup.liveNow')}</span></div>`:''}
        </div>
      </div>`;
  }
  function runSetup() {
    if (state.setupPlaying) return;
    state.setupPlaying = true;
    state.setupStep = 0;
    const token = ++state.setupToken;
    render();
    const delays = { 4: 1100, 12: 900, 13: 1200, 15: 800 };
    const tick = () => {
      if (token!== state.setupToken) return;
      if (state.setupStep >= SETUP_LAST) {
        state.setupPlaying = false;
        render();
        toast(t('setup.doneToast'));
        return;
      }
      state.setupStep++;
      render();
      setTimeout(tick, delays[state.setupStep] || 480);
    };
    setTimeout(tick, 400);
  }

  function lineChart() {
    const W = 460, H = 190, L = 26, R = 8, T = 26, B = 22;
    const data = D.metrics;
    const maxY = Math.max(...data.map((d) => d.leads)) + 1;
    const x = (i) => L + (i / (data.length - 1)) * (W - L - R);
    const y = (v) => T + (1 - v / maxY) * (H - T - B);
    const path = (key) => data.map((d, i) => `${i?'L':'M'}${x(i).toFixed(1)},${y(d[key]).toFixed(1)}`).join('');
    const grid = [0, Math.round(maxY / 2), maxY].map((v) => `
      <line class="grid-line" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/>
      <text x="${L - 5}" y="${y(v) + 3.5}" text-anchor="end">${v}</text>`).join('');
    const last = data[data.length - 1];
    const ticks = [0, 9, 19, 29].map((i) => `<text x="${x(i)}" y="${H - 6}" text-anchor="middle">${data[i].date.slice(5).replace('-','/')}</text>`).join('');
    return `
      <svg class="viz" viewBox="0 0 ${W} ${H}" id="linechart">
        ${grid}
        <line class="axis" x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}"/>
        ${ticks}
        <path d="${path('leads')}" fill="none" stroke="var(--chart-1)" stroke-width="2"/>
        <path d="${path('bookings')}" fill="none" stroke="#1baf7a" stroke-width="2"/>
        <circle cx="${x(data.length - 1)}" cy="${y(last.leads)}" r="3.5" fill="var(--chart-1)"/>
        <circle cx="${x(data.length - 1)}" cy="${y(last.bookings)}" r="3.5" fill="#1baf7a"/>
        <text class="val" x="${x(data.length - 1) - 8}" y="${y(last.leads) - 8}" text-anchor="end" fill="var(--chart-1)">${t('chart.leadsLegend')}</text>
        <text class="val" x="${x(data.length - 1) - 8}" y="${y(last.bookings) + 14}" text-anchor="end" fill="#1baf7a">${t('chart.bookingsLegend')}</text>
        <line id="xhair" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="var(--chart-axis)" stroke-width="1" style="display:none"/>
        <rect x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent" id="linehit"/>
      </svg>
      <div style="display:flex;gap:14px;font-size:11.5px;color:var(--muted)">
        <span><span class="dot" style="background:var(--chart-1)"></span> ${t('chart.leadsLegend')}</span>
        <span><span class="dot" style="background:#1baf7a"></span> ${t('chart.bookingsLegend')}</span>
      </div>`;
  }

  function funnelChart() {
    const W = 460, rowH = 30, gap = 6, L = 78, R = 46;
    const max = D.funnel[0].n;
    const colors = ['var(--funnel-1)','var(--funnel-2)','var(--funnel-3)','var(--funnel-4)','var(--funnel-5)'];
    const H = D.funnel.length * (rowH + gap) + 4;
    return `<svg class="viz" viewBox="0 0 ${W} ${H}">
      ${D.funnel.map((f, i) => {
        const w = Math.max(6, (f.n / max) * (W - L - R));
        const yy = i * (rowH + gap);
        const conv = i > 0? Math.round((f.n / D.funnel[i - 1].n) * 100) +'%':'';
        return `
          <text x="${L - 8}" y="${yy + rowH / 2 + 3.5}" text-anchor="end">${td(f.stage)}</text>
          <rect x="${L}" y="${yy}" width="${w}" height="${rowH - 8}" rx="4" fill="${colors[i]}" data-tip="${td(f.stage)}: ${f.n}${conv? t('chart.funnelTipSuffix', { pct: conv }):''}"/>
          <text class="val" x="${L + w + 7}" y="${yy + rowH / 2 - 1}">${f.n}</text>
          ${conv? `<text x="${L + w + 7}" y="${yy + rowH / 2 + 11}" font-size="9.5">${conv} →</text>`:''}`;
      }).join('')}
    </svg>`;
  }

  const DRILL_MAP = {'QR / walk-in':'QR code' };
  function channelChart() {
    const W = 460, rowH = 30, gap = 6, L = 88, R = 92;
    const max = Math.max(...D.channels.map((c) => c.leads));
    const H = D.channels.length * (rowH + gap) + 4;
    return `<svg class="viz" viewBox="0 0 ${W} ${H}">
      ${D.channels.map((c, i) => {
        const yy = i * (rowH + gap);
        const wAll = (c.leads / max) * (W - L - R);
        const wBook = (c.booked / max) * (W - L - R);
        const rate = Math.round((c.booked / c.leads) * 100);
        const drill = DRILL_MAP[c.name] || c.name;
        const name = chLabel(c.name);
        return `
          <text x="${L - 8}" y="${yy + rowH / 2 + 3.5}" text-anchor="end">${name}</text>
          <rect class="drillable" x="${L}" y="${yy}" width="${wAll}" height="${rowH - 8}" rx="4" fill="var(--funnel-1)" data-drill="${drill}" data-tip="${t('chart.channelLeadsTip', { name, n: c.leads })}"/>
          <rect class="drillable" x="${L}" y="${yy}" width="${wBook}" height="${rowH - 8}" rx="4" fill="var(--funnel-4)" data-drill="${drill}" data-tip="${t('chart.channelBookedTip', { name, n: c.booked, rate })}"/>
          <text class="val" x="${L + wAll + 7}" y="${yy + rowH / 2 + 3.5}">${c.booked}/${c.leads} · ${rate}%</text>`;

  function forecastChart() {
    const W = 460, H = 170, L = 26, R = 10, T = 14, B = 24;
    const data = D.forecast;
    const maxY = Math.max(...data.map((d) => d.hi)) + 1;
    const midY = Math.round(maxY / 2);
    const x = (i) => L + (i / (data.length - 1)) * (W - L - R);
    const y = (v) => T + (1 - v / maxY) * (H - T - B);
    const band = data.map((d, i) => `${i?'L':'M'}${x(i).toFixed(1)},${y(d.hi).toFixed(1)}`).join('') +
      data.slice().reverse().map((d, i) => `L${x(data.length - 1 - i).toFixed(1)},${y(d.lo).toFixed(1)}`).join('') +'Z';
    const mid = data.map((d, i) => `${i?'L':'M'}${x(i).toFixed(1)},${y(d.mid).toFixed(1)}`).join('');
    return `<svg class="viz" viewBox="0 0 ${W} ${H}">
      ${[0, midY, maxY].map((v) => `<line class="grid-line" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 5}" y="${y(v) + 3.5}" text-anchor="end">${v}</text>`).join('')}

  function servicesChart() {

  // ---------- Operations (finance / materials / staff) ----------
  const kMoney = (n) => Math.abs(n) >= 1000? '$' + (n / 1000).toFixed(n % 1000 === 0? 0: 1) + 'k': money(n);
  function finBars() {
    const p = D.finance.periods[state.finPeriod];
    const W = 460, H = 190, L = 40, R = 10, T = 14, B = 26;
    const n = p.cols.length;
    const max = Math.max(...p.revenue, ...p.expense) * 1.05;
    const gw = (W - L - R) / n;
    const bw = Math.min(18, gw / 3);
    const y = (v) => T + (1 - v / max) * (H - T - B);
    const grid = [0, max / 2, max].map((v) => `<line class="grid-line" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 3.5}" text-anchor="end">${kMoney(Math.round(v))}</text>`).join('');
    const bars = p.cols.map((c, i) => {
      const cx = L + gw * i + gw / 2;
      const rev = p.revenue[i], exp = p.expense[i];
      return `
        <rect x="${cx - bw - 1}" y="${y(rev)}" width="${bw}" height="${y(0) - y(rev)}" rx="3" fill="var(--chart-1)" data-tip="${esc(c)} · ${t('ops.revenue')} ${money(rev)}"/>
        <rect x="${cx + 1}" y="${y(exp)}" width="${bw}" height="${y(0) - y(exp)}" rx="3" fill="var(--serious)" data-tip="${esc(c)} · ${t('ops.expense')} ${money(exp)}"/>
        <text x="${cx}" y="${H - 8}" text-anchor="middle">${esc(td(c))}</text>`;
    }).join('');
    return `<svg class="viz" viewBox="0 0 ${W} ${H}">${grid}<line class="axis" x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}"/>${bars}</svg>
      <div style="display:flex;gap:14px;font-size:11.5px;color:var(--muted);margin-top:2px">

      </div>
      <h2 class="sec">${t('ops.purchases')}</h2>
      <div class="card tbl-wrap" style="padding:6px 10px">
        <table class="tbl">
          <thead><tr><th>${t('ops.txItem')}</th><th>${t('ops.poQty')}</th><th class="num">${t('ops.poCost')}</th><th>${t('ops.poSupplier')}</th><th>${t('ops.poStatus')}</th></tr></thead>
          <tbody>${m.purchases.map((po) => `<tr>
            <td><b>${esc(td(po.item))}</b><br><span style="color:var(--muted);font-size:12px">${fmtRel(po.date)}</span></td>
            <td>${esc(td(po.qty))}</td>
            <td class="num">${money(po.cost)}</td>
            <td>${esc(td(po.supplier))}</td>
            <td><span class="tagchip ${po.status ==='delivered'?'st-good': po.status ==='ordered'?'ai':''}">${t(poKey[po.status])}</span></td>
          </tr>`).join('')}</tbody>
        </table>
      </div>`;
  }
  function opsStaff() {
    const s = D.staff;
    const payroll = s.roster.reduce((a, r) => a + r.pay, 0);
    return `
      <div class="stat-row" style="grid-template-columns:repeat(3,1fr)">
        <div class="stat"><b>${s.roster.length}</b><span>${t('ops.roster')}</span></div>
        <div class="stat"><b>${money(payroll)}</b><span>${t('ops.payrollTotal')}</span></div>
        <div class="stat"><b>${s.roster.reduce((a, r) => a + r.records, 0)}</b><span>${t('ops.staffRecords')}</span></div>
      </div>
      <h2 class="sec">${t('ops.roster')}</h2>
      <div class="card tbl-wrap" style="padding:6px 10px">
        <table class="tbl">
          <thead><tr><th>${t('trust.person')}</th><th>${t('ops.staffRole')}</th><th class="num">${t('ops.staffPay')}</th><th class="num">${t('ops.staffShifts')}</th><th class="num">${t('ops.staffRating')}</th><th class="num">${t('ops.staffRecords')}</th></tr></thead>
          <tbody>${s.roster.map((r) => `<tr>
            <td><b>${esc(r.name)}</b></td><td>${esc(td(r.role))}</td>
            <td class="num">${money(r.pay)}</td><td class="num">${r.shiftsWeek}</td>
            <td class="num">${esc(r.rating)}</td><td class="num">${r.records}</td>
          </tr>`).join('')}</tbody>
        </table>
      </div>
      <h2 class="sec">${t('ops.weeklyShifts')}</h2>
      <div class="card tbl-wrap" style="padding:10px 12px">
        <table class="tbl shifts">
          <thead><tr><th></th>${s.shifts.days.map((d) => `<th class="num">${esc(td(d))}</th>`).join('')}</tr></thead>
          <tbody>${s.shifts.rows.map((r) => `<tr><td><b>${esc(r.name)}</b></td>${r.on.map((o) => `<td class="num">${o? '<span class="shift-on">●</span>':'<span class="shift-off">·</span>'}</td>`).join('')}</tr>`).join('')}</tbody>
        </table>
      </div>`;
  }
  function vOperations() {
    const tabs = [['finance','ops.finance'],['materials','ops.materials'],['staff','ops.staff']];
    const body = state.opsTab ==='materials'? opsMaterials(): state.opsTab ==='staff'? opsStaff(): opsFinance();
    return `
      <div class="tabbtns">${tabs.map(([id, k]) => `<button class="tabbtn ${state.opsTab === id?'on':''}" data-ops-tab="${id}">${t(k)}</button>`).join('')}</div>
      ${body}`;
  }

  // ---------- guided tour ----------
  const TOUR = [
    { view:'today', n: 1 }, { view:'inbox', n: 2 }, { view:'inbox', n: 3 }, { view:'customers', n: 4 },
    { view:'marketing', n: 5 }, { view:'social', n: 6 }, { view:'trust', n: 7 }, { view:'insights', n: 8 },
    { view:'setup', n: 9 },
  ];
  function introCard() {
    return `
      <div class="intro-ovl" data-intro-backdrop>
        <div class="intro" role="dialog" aria-modal="true" aria-label="${t('intro.aria')}">
          <div class="intro-mark"><span class="mark" aria-hidden="true">♜</span><b>Rook</b><span class="intro-tag">${t('logo.tagline')}</span></div>
          <h2>${t('intro.title')}</h2>
          <p>${t('intro.body')}</p>
          <ul class="intro-list">
            <li><b>${t('intro.b1t')}</b> ${t('intro.b1')}</li>
            <li><b>${t('intro.b2t')}</b> ${t('intro.b2')}</li>
            <li><b>${t('intro.b3t')}</b> ${t('intro.b3')}</li>
          </ul>
          <div class="intro-note">${t('intro.simNote')}</div>
          <div class="intro-actions">
            <button class="btn" data-intro-dismiss>${t('intro.explore')}</button>
            <button class="btn pri" data-intro-tour>${t('intro.tour')}</button>
          </div>
        </div>
      </div>`;
  }
  function dismissIntro() { state.intro = false; state.introSeen = true; savePrefs(); render(); }
  function tourCard() {
    const s = TOUR[state.tour - 1];
    return `
      <div class="tour" role="dialog" aria-label="${t('tour.aria')}">
        <div class="tour-step">${state.tour} / ${TOUR.length}</div>
        <b>${t('tour.step' + s.n + '.title')}</b>
        <p>${t('tour.step' + s.n + '.text')}</p>
        <div class="tour-actions">
          <button class="btn sm" data-tour-end>${t('tour.endTour')}</button>
          <span class="spacer"></span>
          ${state.tour > 1? `<button class="btn sm" data-tour-back>${t('tour.back')}</button>`:''}
          <button class="btn sm pri" data-tour-next>${state.tour === TOUR.length? t('tour.done'): t('tour.next')}</button>
        </div>
      </div>`;
  }

  // ---------- chrome ----------
  function renderSide() {
    const unread = D.conversations.filter((c) => c.unread).length;
    $('#side').innerHTML = `
      <div class="logo"><div class="logo-row"><span class="mark" aria-hidden="true">♜</span><b>Rook</b></div><span class="logo-tag">${t('logo.tagline')}</span></div>
      ${NAV_IDS.map((id) => `
        <button class="nav-btn ${state.view === id?'on':''}" data-nav="${id}">
          ${IC[id]}${t('nav.' + id)}
          ${id ==='inbox' && unread? `<span class="bdg">${unread}</span>`:''}
        </button>`).join('')}
      <div class="side-foot"><b>${esc(bName())}</b><br>${esc(D.merchant.address)}<br>${esc(td(D.merchant.hours))}
        <br><button class="reset-link" data-reset title="${t('demo.resetHint')}">${t('demo.reset')}</button></div>`;
    $('#tabbar').innerHTML = NAV_IDS.map((id) => `
      <button class="${state.view === id?'on':''}" data-nav="${id}">${IC[id]}${t('nav.' + id)}</button>`).join('');
  }
  function renderTop() {
    $('#topbar').innerHTML = `
      <h1>${t('title.' + state.view)}</h1>
      <span class="sub">${esc(bName())} · ${esc(bTag())}</span>
      <div class="spacer"></div>
      <div class="top-right">
        <div class="seg" role="group" aria-label="${t('aria.langGroup')}">
          <button class="${state.lang ==='en'?'on':''}" data-lang="en">EN</button>
          <button class="${state.lang ==='zh-Hant'?'on':''}" data-lang="zh-Hant">繁中</button>
          <button class="${state.lang ==='zh-Hans'?'on':''}" data-lang="zh-Hans">简中</button>
        </div>
        <div class="seg" role="group" aria-label="${t('aria.industryGroup')}">
          ${INDUSTRIES.map((ind) => `<button class="${state.industry === ind.id?'on':''}" data-industry="${ind.id}">${t('industry.' + ind.id)}</button>`).join('')}
        </div>
        <div class="seg pal" role="group" aria-label="${t('aria.paletteGroup')}">
          ${['azure','indigo','sky'].map((p) => `<button class="pal-dot pal-${p} ${state.palette === p?'on':''}" data-palette="${p}" title="${t('palette.' + p)}" aria-label="${t('palette.' + p)}"><span></span></button>`).join('')}
        </div>
        <button class="btn sm icon-btn" data-intro-open title="${t('intro.help')}" aria-label="${t('intro.help')}">?</button>
        <button class="btn sm" data-tour-start>${state.tour? '● ' + t('tour.running'): '▶ ' + t('tour.button')}</button>
        <span class="chip time">${esc(D.merchant.nowLabel)}</span>
        <span class="chip sim">${t('sim.badge')}</span>
      </div>`;
  }

  let lastView = null;
  function render() {
    renderSide();
    renderTop();
    const views = { today: vToday, inbox: vInbox, bookings: vBookings, followup: vFollowup, customers: vCustomers, marketing: vMarketing, social: vSocial, reputation: vReputation, brain: vBrain, insights: vInsights, operations: vOperations, trust: vTrust, setup: vSetup };
    const el = $('#view');
    el.innerHTML = applyBrand(views[state.view]());
    // animate only on navigation, not on in-view state changes (approve, sim ticks…)
    el.classList.remove('enter');
    if (lastView!== state.view) {
      void el.offsetWidth; // restart the animation
      el.classList.add('enter');
    }
    lastView = state.view;
    const back = $('#view [data-back]');
    if (back && window.innerWidth <= 760) back.style.display ='inline-block';
    const msgs = $('#msgs');
    if (msgs) msgs.scrollTop = msgs.scrollHeight;
    const oldTour = $('.tour');
    if (oldTour) oldTour.remove();
    if (state.tour) document.body.insertAdjacentHTML('beforeend', tourCard());
    const oldIntro = $('.intro-ovl');
    if (oldIntro) oldIntro.remove();
    if (state.intro) {
      document.body.insertAdjacentHTML('beforeend', introCard());
      const introBtn = $('.intro [data-intro-tour]');
      if (introBtn) introBtn.focus();
    }
    bindHover();
    bindUpload();
    bindAsk();
  }

  function switchIndustry(id) {
    if (state.industry === id) return;
    state.industry = id;
    D = DEMOS[id];
    state.simToken++; // cancel any running simulation
    state.setupToken++; // cancel any running onboarding playback
    state.simConvo = null;
    state.simRunning = false;
    state.setupStep = 0;
    state.setupPlaying = false;
    state.convId = D.conversations[0].id;
    state.custId = null;
    state.custFilter ='All';
    state.custChannel = null;
    state.mobilePane ='list';
    state.phoneView = null;
    state.wiz = null;          // wizard copy variants are per-industry
    state.campOpen = {};
    state.opsTab ='finance';
    state.finPeriod ='month';
    state.askLog = [];
    render();
    toast(t('toast.switchedTemplate', { industry: t('industry.' + id) }));
  }

  // ---------- events ----------
  document.addEventListener('click', (e) => {
    const closePhone = e.target.closest('[data-close-phone-btn]') ||
      (e.target.classList && e.target.classList.contains('phone-ovl')? e.target: null);
    if (closePhone) { state.phoneView = null; render(); return; }
    if (e.target.classList && e.target.classList.contains('intro-ovl')) { dismissIntro(); return; }
    const el = e.target.closest('[data-print],[data-ask-send],[data-ask-example],[data-ask-clear],[data-intro-open],[data-intro-dismiss],[data-intro-tour],[data-nav],[data-conv],[data-open-conv],[data-takeover],[data-simulate],[data-approve],[data-hold],[data-approve-camp],[data-post-reply],[data-filter],[data-cust],[data-back-cust],[data-back],[data-toast],[data-industry],[data-lang],[data-phone],[data-setup-play],[data-brief-phone],[data-tour-start],[data-tour-next],[data-tour-back],[data-tour-end],[data-drill],[data-clear-channel],[data-goto],[data-ops-tab],[data-fin-period],[data-reorder],[data-wiz-toggle],[data-wiz-regen],[data-wiz-publish],[data-wiz-reset],[data-wiz-poster],[data-camp-toggle],[data-reply-all],[data-palette],[data-upload-remove],[data-upload-sample],[data-reset],[data-brand-apply],[data-brand-reset]');
    if (!el) return;
    // preserve any in-progress wizard edits before a re-render (except regenerate, which replaces)
    if ((el.dataset.wizToggle!== undefined || el.dataset.wizPublish!== undefined || el.dataset.wizPoster!== undefined) && state.wiz) {
      const ta = $('#wizContent'); if (ta) state.wiz.content = ta.value;
    }
    if (el.dataset.introOpen!== undefined) { state.intro = true; render(); }
    else if (el.dataset.introDismiss!== undefined) { dismissIntro(); }
    else if (el.dataset.introTour!== undefined) { state.intro = false; state.introSeen = true; savePrefs(); state.tour = 1; state.view = TOUR[0].view; render(); window.scrollTo(0, 0); }
    else if (el.dataset.palette) {
      if (state.palette!== el.dataset.palette) {
        state.palette = el.dataset.palette;
        document.documentElement.dataset.palette = state.palette;
        savePrefs();
        render();
      }
    }
    else if (el.dataset.brandApply!== undefined) {
      const gv = (id) => { const n = $('#' + id); return n? n.value.trim():''; };
      const name = gv('brandName'), tagline = gv('brandTagline'), ownerFirst = gv('brandOwner');
      if (!name && !tagline && !ownerFirst) { state.brand = null; }
      else { state.brand = { name, tagline, ownerFirst }; }
      savePrefs(); render(); toast(t('setup.brandToast'));
    }
    else if (el.dataset.brandReset!== undefined) { state.brand = null; savePrefs(); render(); toast(t('setup.brandResetToast')); }
    else if (el.dataset.askSend!== undefined) { const n = $('#askInput'); askAI(n? n.value:''); }
    else if (el.dataset.askExample!== undefined) { askAI(el.dataset.askExample); }
    else if (el.dataset.askClear!== undefined) { state.askLog = []; render(); }
    else if (el.dataset.print!== undefined) { doPrint(); }
    else if (el.dataset.reset!== undefined) { resetDemo(); }
    else if (el.dataset.uploadRemove!== undefined) { state.uploads.splice(+el.dataset.uploadRemove, 1); savePrefs(); render(); }
    else if (el.dataset.uploadSample!== undefined) {
      state.uploads = D.onboarding.files.map((f, i) => ({ name: f.name, size: (i + 2) * 268 * 1024 + i * 7331 }));
      savePrefs();
      render();
    }
    else if (el.dataset.industry) switchIndustry(el.dataset.industry);
    else if (el.dataset.goto) {
      state.view = el.dataset.goto; state.custId = null; state.custChannel = null;
      state.custFilter = el.dataset.gotoFilter || 'All';
      state.mobilePane = el.dataset.gotoConv? 'thread':'list'; state.phoneView = null;
      if (el.dataset.gotoOptab) state.opsTab = el.dataset.gotoOptab;
      if (el.dataset.gotoConv) state.convId = el.dataset.gotoConv;
      render(); window.scrollTo(0, 0);
    }
    else if (el.dataset.opsTab) { state.opsTab = el.dataset.opsTab; render(); }
    else if (el.dataset.finPeriod) { state.finPeriod = el.dataset.finPeriod; render(); }
    else if (el.dataset.reorder!== undefined) { toast(t('ops.reorderToast')); }
    else if (el.dataset.wizToggle!== undefined) {
      const kind = el.dataset.wizToggle, val = el.dataset.wizVal;
      state.wiz[kind][val] =!state.wiz[kind][val];
      render();
    }
    else if (el.dataset.wizRegen!== undefined) {
      state.wiz.variantIdx = (state.wiz.variantIdx + 1) % D.publishWizard.variants.length;
      state.wiz.content = D.publishWizard.variants[state.wiz.variantIdx];
      render();
    }
    else if (el.dataset.wizPublish!== undefined) {
      const w = state.wiz;
      const has = (o) => Object.values(o).some(Boolean);
      if (!has(w.goals) || !has(w.audiences) || !has(w.platforms)) { toast(t('mkt.needSelection')); return; }
      w.published = true; toast(t('mkt.publishToast')); render();
    }
    else if (el.dataset.wizPoster!== undefined) { state.wiz.poster = +el.dataset.wizPoster; render(); }
    else if (el.dataset.wizReset!== undefined) { state.wiz = freshWiz(); render(); }
    else if (el.dataset.replyAll!== undefined) {
      const pend = D.reviews.filter((r) => r.replyStatus!=='posted' && !state.reviewPosted[r.id]);
      pend.forEach((r) => { state.reviewPosted[r.id] = true; });
      toast(t('rep.replyAllToast', { n: pend.length }));
      render();
    }
    else if (el.dataset.campToggle) { const id = el.dataset.campToggle; state.campOpen[id] =!state.campOpen[id]; render(); }
    else if (el.dataset.lang) { if (state.lang!== el.dataset.lang) { state.lang = el.dataset.lang; document.documentElement.lang = state.lang; savePrefs(); render(); } }
    else if (el.dataset.tourStart!== undefined) { state.tour = 1; state.view = TOUR[0].view; render(); window.scrollTo(0, 0); }
    else if (el.dataset.tourNext!== undefined) {
      if (state.tour >= TOUR.length) { state.tour = 0; render(); toast(t('tour.doneToast')); }
      else { state.tour++; state.view = TOUR[state.tour - 1].view; render(); window.scrollTo(0, 0); }
    }
    else if (el.dataset.tourBack!== undefined) { state.tour = Math.max(1, state.tour - 1); state.view = TOUR[state.tour - 1].view; render(); window.scrollTo(0, 0); }
    else if (el.dataset.tourEnd!== undefined) { state.tour = 0; render(); }
    else if (el.dataset.briefPhone!== undefined) { state.phoneView ='brief'; render(); }
    else if (el.dataset.nav) { state.view = el.dataset.nav; state.custId = null; state.custChannel = null; state.mobilePane ='list'; state.phoneView = null; render(); window.scrollTo(0, 0); }
    else if (el.dataset.drill) { state.view ='customers'; state.custId = null; state.custFilter ='All'; state.custChannel = el.dataset.drill; render(); window.scrollTo(0, 0); }
    else if (el.dataset.clearChannel!== undefined) { state.custChannel = null; render(); }
    else if (el.dataset.conv) { state.convId = el.dataset.conv; state.mobilePane ='thread'; render(); }
    else if (el.dataset.openConv) { state.view ='inbox'; state.convId = el.dataset.openConv; state.mobilePane ='thread'; render(); window.scrollTo(0, 0); }
    else if (el.dataset.back!== undefined && el.dataset.back ==='') { state.mobilePane ='list'; render(); }
    else if (el.dataset.phone!== undefined && el.dataset.phone ==='') { state.phoneView ='conv'; render(); }
    else if (el.dataset.setupPlay!== undefined) runSetup();
    else if (el.dataset.takeover) {
      const id = el.dataset.takeover;
      const c = getConv(id);
      state.aiPaused[id] =!state.aiPaused[id];
      c.messages.push({ from:'sys', text: state.aiPaused[id]? t('toast.takenOverSys'): t('toast.handedBackSys') });
      toast(state.aiPaused[id]? t('toast.aiPausedToast'): t('toast.aiResumedToast'));
      render();
    }
    else if (el.dataset.simulate!== undefined) runSimulation();
    else if (el.dataset.approve) {
      const a = D.approvals.find((x) => x.id === el.dataset.approve);
      state.done[a.id] = true;
      if (a.action.campaign) state.campaign[a.action.campaign] ='scheduled';
      if (a.action.review) state.reviewPosted[a.action.review] = true;
      if (a.action.knowledge) state.kbApproved[a.action.knowledge] = true;
      toast(td(a.toast));
      render();
    }
    else if (el.dataset.hold) { state.done[el.dataset.hold] = true; toast(t('toast.held')); render(); }
    else if (el.dataset.approveCamp) {
      const cid = el.dataset.approveCamp;
      state.campaign[cid] ='scheduled';
      const a = D.approvals.find((x) => x.action.campaign === cid);
      if (a) state.done[a.id] = true;
      toast(t('toast.campaignApproved'));
      render();
    }
    else if (el.dataset.postReply) {
      const rid = el.dataset.postReply;
      state.reviewPosted[rid] = true;
      const a = D.approvals.find((x) => x.action.review === rid);
      if (a) state.done[a.id] = true;
      toast(t('toast.replyPostedGoogle'));
      render();
    }
    else if (el.dataset.filter) { state.custFilter = el.dataset.filter; render(); }
    else if (el.dataset.cust) { state.custId = el.dataset.cust; render(); window.scrollTo(0, 0); }
    else if (el.dataset.backCust!== undefined) { state.custId = null; render(); }
    else if (el.dataset.toast) toast(el.dataset.toast);
  });

  // Escape closes the top-most transient layer (overlay > phone > tour).
  document.addEventListener('keydown', (e) => {
    if (e.key!=='Escape') return;
    if (state.intro) { dismissIntro(); }
    else if (state.phoneView) { state.phoneView = null; render(); }
    else if (state.tour) { state.tour = 0; render(); }
  });

  // ---------- document upload ----------
  function addUploads(fileList) {
    if (!fileList || !fileList.length) return;
    for (const f of fileList) state.uploads.push({ name: f.name, size: f.size });
    savePrefs();
    render();
  }
  document.addEventListener('change', (e) => {
    if (e.target && e.target.id ==='uploadInput') addUploads(e.target.files);
  });
  function bindUpload() {
    const dz = $('#dropzone');
    if (!dz) return;
    const stop = (e) => { e.preventDefault(); e.stopPropagation(); };
    ['dragenter','dragover'].forEach((ev) => dz.addEventListener(ev, (e) => { stop(e); dz.classList.add('drag'); }));
    ['dragleave','dragend'].forEach((ev) => dz.addEventListener(ev, (e) => { stop(e); dz.classList.remove('drag'); }));
    dz.addEventListener('drop', (e) => { stop(e); dz.classList.remove('drag'); addUploads(e.dataTransfer && e.dataTransfer.files); });
  }
  function bindAsk() {
    const inp = $('#askInput');
    if (!inp) return;
    inp.addEventListener('keydown', (e) => { if (e.key ==='Enter') { e.preventDefault(); askAI(inp.value); } });
    const log = $('.ask-log');
    if (log) log.scrollTop = log.scrollHeight;
  }

  // ---------- chart hover ----------
  const tip = $('#tooltip');
  function bindHover() {
    document.querySelectorAll('[data-tip]').forEach((el) => {
      el.addEventListener('mousemove', (e) => {
        tip.textContent = el.dataset.tip;
        tip.style.display ='block';
        tip.style.left = e.clientX +'px';
        tip.style.top = e.clientY +'px';
      });
      el.addEventListener('mouseleave', () => { tip.style.display ='none'; });
    });
    const hit = $('#linehit');
    if (hit) {
      const svg = $('#linechart');
      const xh = svg.querySelector('#xhair');
      const data = D.metrics;
      const L = 26, R = 8, W = 460;
      hit.addEventListener('mousemove', (e) => {
        const r = svg.getBoundingClientRect();
        const px = ((e.clientX - r.left) / r.width) * W;
        const i = Math.max(0, Math.min(data.length - 1, Math.round(((px - L) / (W - L - R)) * (data.length - 1))));
        const xx = L + (i / (data.length - 1)) * (W - L - R);
        xh.setAttribute('x1', xx); xh.setAttribute('x2', xx);
        xh.style.display ='block';
        const d = data[i];
        tip.textContent = `${d.date.slice(5).replace('-','/')} — ${d.leads} leads · ${d.bookings} bookings`;
        tip.style.display ='block';
        tip.style.left = e.clientX +'px';
        tip.style.top = e.clientY +'px';
      });
      hit.addEventListener('mouseleave', () => { xh.style.display ='none'; tip.style.display ='none'; });
    }
  }

  loadPrefs();
  if (!state.introSeen) state.intro = true;
  document.documentElement.dataset.palette = state.palette;
  document.documentElement.lang = state.lang;
  render();
})();

</script>
