<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rook — AI Growth Team · Demo</title>
<style>
/* Rook demo — owner console. Token-driven, light/dark. */
:root {
  --bg: #f5f4ef;
  --surface: #ffffff;
  --surface-2: #faf9f6;
  --ink: #171f1b;
  --ink-2: #56605a;
  --muted: #879088;
  --line: #e4e3da;
  --line-strong: #cfcec4;
  --accent: #1a6353;
  --accent-hover: #14503f;
  --accent-ink: #ffffff;
  --accent-soft: #e5efe9;
  --accent-soft-ink: #14503f;
  --good: #0ca30c; --good-text: #006300;
  --warn: #fab219; --serious: #ec835a; --crit: #d03b3b;
  --chart-1: #2a78d6;
  --chart-grid: #e1e0d9;
  --chart-axis: #c3c2b7;
  --funnel-1: #86b6ef; --funnel-2: #5598e7; --funnel-3: #2a78d6; --funnel-4: #1c5cab; --funnel-5: #104281;
  --bubble-cust: #ecebe4;
  --shadow: 0 1px 2px rgba(23, 31, 27, 0.05);
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #101413;
    --surface: #1a201d;
    --surface-2: #161c19;
    --ink: #eef1ee;
    --ink-2: #b4beb7;
    --muted: #7f8983;
    --line: #2a322e;
    --line-strong: #3a443f;
    --accent: #4fae95;
    --accent-hover: #66c0a8;
    --accent-ink: #0c1512;
    --accent-soft: #1e2f29;
    --accent-soft-ink: #8fd0bc;
    --good: #0ca30c; --good-text: #35b435;
    --chart-1: #3987e5;
    --chart-grid: #2c2c2a;
    --chart-axis: #383835;
    --funnel-1: #86b6ef; --funnel-2: #5598e7; --funnel-3: #3987e5; --funnel-4: #2a78d6; --funnel-5: #184f95;
    --bubble-cust: #262e2a;
    --shadow: none;
  }
}
:root[data-theme="light"] {
  --bg: #f5f4ef; --surface: #ffffff; --surface-2: #faf9f6;
  --ink: #171f1b; --ink-2: #56605a; --muted: #879088;
  --line: #e4e3da; --line-strong: #cfcec4;
  --accent: #1a6353; --accent-hover: #14503f; --accent-ink: #ffffff;
  --accent-soft: #e5efe9; --accent-soft-ink: #14503f;
  --good: #0ca30c; --good-text: #006300;
  --chart-1: #2a78d6; --chart-grid: #e1e0d9; --chart-axis: #c3c2b7;
  --funnel-1: #86b6ef; --funnel-2: #5598e7; --funnel-3: #2a78d6; --funnel-4: #1c5cab; --funnel-5: #104281;
  --bubble-cust: #ecebe4; --shadow: 0 1px 2px rgba(23,31,27,0.05);
}
:root[data-theme="dark"] {
  --bg: #101413; --surface: #1a201d; --surface-2: #161c19;
  --ink: #eef1ee; --ink-2: #b4beb7; --muted: #7f8983;
  --line: #2a322e; --line-strong: #3a443f;
  --accent: #4fae95; --accent-hover: #66c0a8; --accent-ink: #0c1512;
  --accent-soft: #1e2f29; --accent-soft-ink: #8fd0bc;
  --good: #0ca30c; --good-text: #35b435;
  --chart-1: #3987e5; --chart-grid: #2c2c2a; --chart-axis: #383835;
  --funnel-1: #86b6ef; --funnel-2: #5598e7; --funnel-3: #3987e5; --funnel-4: #2a78d6; --funnel-5: #184f95;
  --bubble-cust: #262e2a; --shadow: none;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 14px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; cursor: pointer; }
a { color: var(--accent); }

.shell { display: grid; grid-template-columns: 218px 1fr; min-height: 100vh; }

/* ---- sidebar ---- */
.side {
  border-right: 1px solid var(--line);
  padding: 18px 12px;
  position: sticky; top: 0; height: 100vh;
  display: flex; flex-direction: column; gap: 4px;
  background: var(--surface-2);
}
.logo { display: flex; align-items: baseline; gap: 8px; padding: 4px 10px 14px; }
.logo b { font-size: 19px; letter-spacing: -0.02em; }
.logo span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
.nav-btn {
  display: flex; align-items: center; gap: 10px;
  width: 100%; text-align: left;
  padding: 8px 10px; border: 0; border-radius: 8px;
  background: transparent; color: var(--ink-2);
}
.nav-btn svg { flex: none; opacity: 0.75; }
.nav-btn:hover { background: var(--accent-soft); color: var(--accent-soft-ink); }
.nav-btn.on { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.nav-btn.on svg { opacity: 1; }
.nav-btn .bdg { margin-left: auto; font-size: 11px; background: var(--crit); color: #fff; border-radius: 99px; padding: 0 6px; line-height: 17px; }
.nav-btn.on .bdg { background: var(--accent-ink); color: var(--accent); }
.side-foot { margin-top: auto; padding: 10px; font-size: 11.5px; color: var(--muted); line-height: 1.5; }

/* ---- main ---- */
.main { min-width: 0; padding: 0 26px 90px; }
.topbar {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 16px 0 14px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 20px;
}
.topbar h1 { font-size: 16px; margin: 0; font-weight: 650; }
.topbar .sub { color: var(--muted); font-size: 12.5px; }
.chip {
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em;
  padding: 3px 9px; border-radius: 99px; font-weight: 600;
}
.chip.sim { background: var(--warn); color: #402b00; }
.chip.time { background: var(--accent-soft); color: var(--accent-soft-ink); }
.spacer { flex: 1; }

h2.sec { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 26px 0 10px; font-weight: 650; }
h2.sec:first-child { margin-top: 0; }

.card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 16px 18px;
}
.grid { display: grid; gap: 12px; }
.grid.c2 { grid-template-columns: 1fr 1fr; }
.grid.c3 { grid-template-columns: repeat(3, 1fr); }

/* ---- today ---- */
.brief { border-left: 3px solid var(--accent); }
.brief h3 { margin: 0 0 6px; font-size: 15.5px; }
.brief p { margin: 0; color: var(--ink-2); max-width: 62ch; }
.stat-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
.stat b { display: block; font-size: 22px; font-weight: 650; letter-spacing: -0.01em; }
.stat span { font-size: 12px; color: var(--muted); }
.opp { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.opp + .opp { margin-top: 8px; }
.opp .stripe { flex: none; width: 4px; align-self: stretch; border-radius: 2px; }
.opp.critical .stripe { background: var(--crit); }
.opp.decision .stripe { background: var(--warn); }
.opp.watch .stripe { background: var(--chart-1); }
.opp.suggestion .stripe { background: var(--good); }
.opp .who { font-weight: 650; }
.opp .why { color: var(--ink-2); font-size: 13px; max-width: 68ch; }
.opp .val { margin-left: auto; flex: none; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
.opp .go { flex: none; align-self: center; }

.appr { display: flex; gap: 12px; align-items: center; padding: 11px 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.appr + .appr { margin-top: 8px; }
.appr .k { flex: none; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.07em; font-weight: 700; color: var(--accent-soft-ink); background: var(--accent-soft); border-radius: 5px; padding: 3px 7px; }
.appr .t b { font-weight: 650; display: block; }
.appr .t span { font-size: 12.5px; color: var(--ink-2); }
.appr .act { margin-left: auto; flex: none; display: flex; gap: 6px; }

.btn {
  border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink);
  border-radius: 8px; padding: 6px 12px; font-size: 13px; font-weight: 550;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.pri:hover { background: var(--accent-hover); border-color: var(--accent-hover); color: var(--accent-ink); }
.btn.sm { padding: 4px 10px; font-size: 12.5px; }
.btn[disabled] { opacity: 0.55; cursor: default; }

/* ---- inbox ---- */
.inbox { display: grid; grid-template-columns: 290px minmax(0, 1fr) 265px; gap: 14px; align-items: start; }
.convo-list { display: flex; flex-direction: column; gap: 6px; }
.convo {
  text-align: left; border: 1px solid var(--line); background: var(--surface);
  border-radius: var(--radius); padding: 10px 12px; width: 100%;
  display: block; color: inherit;
}
.convo:hover { border-color: var(--accent); }
.convo.on { border-color: var(--accent); background: var(--accent-soft); }
.convo .r1 { display: flex; gap: 8px; align-items: baseline; }
.convo .r1 b { font-weight: 650; font-size: 13.5px; }
.convo .r1 time { margin-left: auto; font-size: 11px; color: var(--muted); flex: none; }
.convo .pv { font-size: 12.5px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.convo .r2 { display: flex; gap: 6px; margin-top: 6px; align-items: center; }
.dot { width: 7px; height: 7px; border-radius: 99px; display: inline-block; }
.tagchip { font-size: 10.5px; padding: 1px 7px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-2); }
.tagchip.ai { background: var(--accent-soft); border-color: transparent; color: var(--accent-soft-ink); font-weight: 600; }
.tagchip.human { background: var(--warn); border-color: transparent; color: #402b00; font-weight: 600; }
.tagchip.esc { background: var(--crit); border-color: transparent; color: #fff; font-weight: 600; }

.thread { display: flex; flex-direction: column; min-height: 480px; }
.thread-head { display: flex; align-items: center; gap: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.thread-head b { font-size: 15px; }
.thread-head .sub { color: var(--muted); font-size: 12px; }
.msgs { flex: 1; display: flex; flex-direction: column; gap: 10px; padding: 16px 2px; }
.msg { max-width: 78%; padding: 8px 12px; border-radius: 14px; position: relative; }
.msg.cust { align-self: flex-start; background: var(--bubble-cust); border-bottom-left-radius: 4px; }
.msg.ai, .msg.staff { align-self: flex-end; background: var(--accent-soft); color: var(--ink); border-bottom-right-radius: 4px; }
.msg .meta { display: block; font-size: 10.5px; color: var(--muted); margin-top: 4px; }
.msg .cite { display: inline-block; font-size: 10.5px; margin-top: 6px; padding: 2px 8px; border-radius: 99px; border: 1px dashed var(--accent); color: var(--accent-soft-ink); }
.msg.sys { align-self: center; max-width: 92%; background: transparent; border: 1px dashed var(--line-strong); color: var(--muted); font-size: 11.5px; text-align: center; border-radius: 8px; }
.typing { align-self: flex-end; background: var(--accent-soft); border-radius: 14px; padding: 10px 14px; }
.typing i { display: inline-block; width: 5px; height: 5px; margin: 0 1.5px; background: var(--accent); border-radius: 99px; animation: blink 1s infinite; }
.typing i:nth-child(2) { animation-delay: 0.18s; } .typing i:nth-child(3) { animation-delay: 0.36s; }
@keyframes blink { 0%, 70%, 100% { opacity: 0.25; } 35% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .typing i { animation: none; } }

.ctx .card + .card { margin-top: 10px; }
.ctx h4 { margin: 0 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 12.5px; }
.kv dt { color: var(--muted); margin: 0; }
.kv dd { margin: 0; font-weight: 550; }
.score-pill { font-size: 20px; font-weight: 650; }
.handoff { border-left: 3px solid var(--warn); }
.handoff p { margin: 0; font-size: 12.5px; color: var(--ink-2); }
.nextact { border-left: 3px solid var(--accent); }
.nextact p { margin: 0; font-size: 12.5px; color: var(--ink-2); }

/* ---- customers ---- */
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.fbtn { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 99px; padding: 4px 12px; font-size: 12.5px; color: var(--ink-2); }
.fbtn.on { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 600; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 650; padding: 8px 10px; border-bottom: 1px solid var(--line-strong); }
.tbl td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl tr.rowbtn { cursor: pointer; }
.tbl tr.rowbtn:hover td { background: var(--surface-2); }
.tbl .num { text-align: right; font-variant-numeric: tabular-nums; }
.tbl-wrap { overflow-x: auto; }
.lc { font-size: 11px; font-weight: 650; padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
.lc.Active { background: var(--accent-soft); color: var(--accent-soft-ink); }
.lc.VIP { background: var(--funnel-4); color: #fff; }
.lc.Dormant { background: var(--surface-2); border: 1px solid var(--line-strong); color: var(--muted); }
.lc.Converted { background: var(--accent-soft); color: var(--accent-soft-ink); }
.lc.Evaluating { background: var(--warn); color: #402b00; }
.lc.churn { background: var(--crit); color: #fff; }
.lc.lead { background: var(--surface-2); border: 1px solid var(--line-strong); color: var(--ink-2); }
.cust-detail .timeline { list-style: none; margin: 8px 0 0; padding: 0; }
.cust-detail .timeline li { position: relative; padding: 0 0 14px 22px; border-left: 2px solid var(--line); margin-left: 6px; }
.cust-detail .timeline li::before { content: ""; position: absolute; left: -6px; top: 3px; width: 10px; height: 10px; border-radius: 99px; background: var(--accent); border: 2px solid var(--surface); }
.cust-detail .timeline time { font-size: 11px; color: var(--muted); display: block; }

/* ---- marketing ---- */
.camp { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); padding: 16px 18px; }
.camp + .camp { margin-top: 10px; }
.camp .head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.camp .head b { font-size: 14.5px; font-weight: 650; }
.camp .status { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; padding: 2px 9px; border-radius: 99px; }
.status.pending { background: var(--warn); color: #402b00; }
.status.scheduled { background: var(--accent-soft); color: var(--accent-soft-ink); }
.status.completed { background: var(--surface-2); border: 1px solid var(--line-strong); color: var(--muted); }
.status.approved { background: var(--good); color: #fff; }
.camp .row { display: grid; grid-template-columns: 110px 1fr; gap: 3px 14px; font-size: 13px; margin-top: 10px; }
.camp .row dt { color: var(--muted); }
.camp .row dd { margin: 0; color: var(--ink-2); }
.camp .copy { font-style: italic; background: var(--surface-2); border: 1px dashed var(--line-strong); border-radius: 8px; padding: 8px 12px; margin-top: 10px; font-size: 13px; color: var(--ink-2); max-width: 68ch; }
.camp .est { display: flex; gap: 18px; margin-top: 12px; flex-wrap: wrap; }
.camp .est div b { display: block; font-size: 16px; font-variant-numeric: tabular-nums; }
.camp .est div span { font-size: 11.5px; color: var(--muted); }
.camp .actions { margin-top: 12px; display: flex; gap: 8px; }

/* ---- reputation ---- */
.rev { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); padding: 14px 16px; }
.rev + .rev { margin-top: 10px; }
.rev .head { display: flex; gap: 10px; align-items: baseline; }
.rev .stars { color: var(--warn); letter-spacing: 2px; font-size: 13px; }
.rev.neg .stars { color: var(--crit); }
.rev p.txt { margin: 8px 0; color: var(--ink-2); max-width: 68ch; }
.rev .reply { border-left: 3px solid var(--accent); padding: 8px 12px; background: var(--surface-2); border-radius: 0 8px 8px 0; font-size: 13px; color: var(--ink-2); max-width: 66ch; }
.rev .reply .lbl { display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin-bottom: 3px; font-weight: 700; }
.theme-row { display: flex; align-items: center; gap: 10px; font-size: 13px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.theme-row:last-child { border-bottom: 0; }
.theme-row .bar { height: 8px; border-radius: 4px; background: var(--chart-1); }
.theme-row.warn .bar { background: var(--warn); }
.theme-row.bad .bar { background: var(--crit); }
.theme-row .n { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }

/* ---- brain ---- */
.kb { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); padding: 13px 16px; }
.kb + .kb { margin-top: 8px; }
.kb .head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.kb .head b { font-weight: 650; }
.kb .head .cat { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.kb .head .cites { margin-left: auto; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
.kb p { margin: 6px 0 0; font-size: 13px; color: var(--ink-2); max-width: 72ch; }
.kb .meta { font-size: 11.5px; color: var(--muted); margin-top: 6px; }
.lock { font-size: 10.5px; font-weight: 700; color: var(--serious); text-transform: uppercase; letter-spacing: 0.05em; }
.gap { border-left: 3px solid var(--warn); }
.gap b { font-weight: 650; }
.gap p { margin: 3px 0 0; font-size: 12.5px; color: var(--ink-2); }

/* ---- insights / charts ---- */
.chart-card h3 { margin: 0 0 2px; font-size: 13.5px; font-weight: 650; }
.chart-card .sub { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
.viz { width: 100%; height: auto; display: block; }
.viz text { font: 10.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--muted); }
.viz .val { fill: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.viz .grid-line { stroke: var(--chart-grid); stroke-width: 1; }
.viz .axis { stroke: var(--chart-axis); stroke-width: 1; }
.tooltip {
  position: fixed; z-index: 30; pointer-events: none;
  background: var(--ink); color: var(--bg);
  font-size: 12px; padding: 5px 9px; border-radius: 7px;
  transform: translate(-50%, calc(-100% - 10px));
  white-space: nowrap; display: none;
}
.strategy li { margin-bottom: 8px; color: var(--ink-2); max-width: 72ch; }
.strategy li::marker { color: var(--accent); }
.kpi-delta { font-size: 11.5px; color: var(--good-text); }

/* ---- toast ---- */
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 10px;
  font-size: 13.5px; font-weight: 550; z-index: 50; box-shadow: 0 6px 24px rgba(0,0,0,0.25);
  opacity: 0; transition: opacity 0.25s, translate 0.25s;
}
.toast.show { opacity: 1; }

/* ---- tabbar (mobile) ---- */
.tabbar { display: none; }

button:focus-visible, .convo:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

@media (max-width: 1080px) {
  .inbox { grid-template-columns: 250px minmax(0, 1fr); }
  .inbox .ctx { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
  .ctx .card + .card { margin-top: 0; }
  .stat-row { grid-template-columns: repeat(3, 1fr); }
  .grid.c3 { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 760px) {
  .shell { grid-template-columns: 1fr; }
  .side { display: none; }
  .main { padding: 0 14px 96px; }
  .grid.c2, .grid.c3 { grid-template-columns: 1fr; }
  .stat-row { grid-template-columns: repeat(2, 1fr); }
  .inbox { grid-template-columns: 1fr; }
  .inbox .list-pane.hidden-m, .inbox .thread-pane.hidden-m { display: none; }
  .opp .val { display: none; }
  .appr { flex-wrap: wrap; }
  .appr .act { margin-left: 0; width: 100%; }
  .tabbar {
    display: flex; position: fixed; bottom: 0; left: 0; right: 0; z-index: 40;
    background: var(--surface); border-top: 1px solid var(--line);
    padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
  }
  .tabbar button {
    flex: 1; border: 0; background: none; color: var(--muted);
    font-size: 10px; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px 0;
  }

<script>
/* Rook demo — owner console app. No dependencies; all data from data.js. */
(() => {
  const D = window.DEMO;
  const NOW = new Date(D.merchant.now);
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

  const state = {
    view: 'today',
    convId: 'v-priya',
    mobilePane: 'list',
    custFilter: 'All',
    custId: null,
    aiPaused: {},
    done: {},          // approval ids that were actioned
    campaign: {},      // campaign id -> new status
    reviewPosted: {},
    simConvo: null,
    simRunning: false,
  };

  // ---------- formatting ----------
  // All clock times shown in the merchant's timezone (SGT), whoever views the demo.
  const fmtClock = (iso) => new Date(iso)
    .toLocaleTimeString('en-SG', { hour: 'numeric', minute: '2-digit', timeZone: 'Asia/Singapore' })
    .toUpperCase();
  const fmtRel = (iso) => {
    if (!iso) return '—';
    const ms = NOW - new Date(iso);
    const h = ms / 36e5;
    if (h < -0.01) {
      const dAhead = Math.round(-h / 24);
      return dAhead <= 1 ? 'tomorrow' : `in ${dAhead}d`;
    }
    if (h < 1) return `${Math.max(1, Math.round(ms / 6e4))}m ago`;
    if (h < 22) return `${Math.round(h)}h ago`;
    const days = Math.round(h / 24);
    if (days <= 1) return 'yesterday';
    if (days < 7) return `${days}d ago`;
    if (days < 30) return `${Math.round(days / 7)}w ago`;
    return `${Math.round(days / 30)}mo ago`;
  };
  const money = (n) => '$' + Number(n).toLocaleString('en-SG');

  // ---------- icons ----------
  const IC = {
    today: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="3.2"/><path d="M8 1.2v1.8M8 13v1.8M1.2 8H3M13 8h1.8M3.2 3.2l1.3 1.3M11.5 11.5l1.3 1.3M12.8 3.2l-1.3 1.3M4.5 11.5l-1.3 1.3"/></svg>',

    marketing: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 6.5v3l8 3v-9zM10 5.5c2 .5 3 1.4 3 2.5s-1 2-3 2.5M4 9.8V13" stroke-linejoin="round"/></svg>',

  };
  const NAV = [
    ['today', 'Today'], ['inbox', 'Inbox'], ['customers', 'Customers'],
    ['marketing', 'Marketing'], ['reputation', 'Reputation'],
    ['brain', 'Brain'], ['insights', 'Insights'],
  ];
  const TITLES = {
    today: 'Today', inbox: 'Inbox — all channels', customers: 'Customers',
    marketing: 'Marketing automation', reputation: 'Reputation & experience',
    brain: 'Business brain', insights: 'Business insight',
  };

  // ---------- shared bits ----------
  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._h);
    t._h = setTimeout(() => t.classList.remove('show'), 2600);
  }
  const statusChip = (c) => {
    if (state.aiPaused[c.id]) return '<span class="tagchip human">Staff (you)</span>';
    if (c.aiStatus === 'ai') return '<span class="tagchip ai">AI handling</span>';
    if (c.aiStatus === 'human') return '<span class="tagchip human">With staff</span>';
    return '<span class="tagchip esc">Needs you</span>';
  };
  const chIcon = { WhatsApp: 'WA', Instagram: 'IG', Google: 'G', 'QR code': 'QR', Referral: 'REF' };

  // ---------- Today ----------
  function vToday() {
    const pending = D.approvals.filter((a) => !state.done[a.id]);
    return `

      <div class="stat-row">
        ${D.aiActivity.map((a) => `<div class="stat"><b>${a.n}</b><span>${esc(a.label)}</span></div>`).join('')}
      </div>
      <h2 class="sec">Today's opportunities</h2>

        <div class="opp ${o.kind}">

        <div class="appr">
          <span class="k">${esc(a.type)}</span>
          <div class="t"><b>${esc(a.title)}</b><span>${esc(a.detail)}</span></div>
          <div class="act">
            <button class="btn sm pri" data-approve="${a.id}">Approve</button>
            <button class="btn sm" data-hold="${a.id}">Hold</button>

        </div>`).join('')}`;
  }

  // ---------- Inbox ----------
  function convoList() {
    const list = [];
    if (state.simConvo) list.push(state.simConvo);
    list.push(...D.conversations);
    return list;
  }
  function getConv(id) { return convoList().find((c) => c.id === id); }

  function vInbox() {
    const conv = getConv(state.convId) || convoList()[0];
    const listHtml = convoList().map((c) => `
      <button class="convo ${c.id === conv.id ? 'on' : ''}" data-conv="${c.id}">
        <span class="r1"><b>${esc(c.name)}</b><time>${fmtRel(c.time)}</time></span>
        <span class="pv">${esc(c.preview)}</span>
        <span class="r2">
          <span class="tagchip">${chIcon[c.channel] || c.channel}</span>
          ${statusChip(c)}
          ${c.score != null ? `<span class="tagchip">Score ${c.score}</span>` : ''}
        </span>
      </button>`).join('');

    const msgs = conv.messages.map(msgHtml).join('');
    const paused = state.aiPaused[conv.id];
    const listHide = state.mobilePane === 'thread' ? 'hidden-m' : '';
    const threadHide = state.mobilePane === 'list' ? 'hidden-m' : '';

    return `
      <div class="inbox">
        <div class="list-pane ${listHide}">
          <button class="btn pri" style="width:100%;margin-bottom:10px" data-simulate ${state.simRunning ? 'disabled' : ''}>
            ${state.simConvo ? '↻ Replay' : '▶ Simulate'} a live inquiry
          </button>
          <div class="convo-list">${listHtml}</div>
        </div>
        <div class="card thread thread-pane ${threadHide}">
          <div class="thread-head">
            <button class="btn sm only-m" data-back style="display:none">←</button>
            <div><b>${esc(conv.name)}</b><div class="sub">${esc(conv.channel)} · ${esc(conv.customerLine || conv.intent || '')}</div></div>
            <div class="spacer"></div>
            ${statusChip(conv)}
            <button class="btn sm" data-takeover="${conv.id}">${paused ? 'Hand back to AI' : 'Take over'}</button>
          </div>
          <div class="msgs" id="msgs">${msgs}</div>
        </div>
        <div class="ctx ${threadHide}">
          ${conv.score != null ? `<div class="card"><h4>Lead score</h4><span class="score-pill">${conv.score}</span><span style="color:var(--muted)"> / 100 · ${esc(conv.intent)}</span></div>` : ''}
          ${conv.fields ? `<div class="card"><h4>Extracted by AI</h4><dl class="kv">${Object.entries(conv.fields).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl></div>` : ''}
          ${conv.handoff ? `<div class="card handoff"><h4>Why the AI stopped</h4><p>${esc(conv.handoff)}</p></div>` : ''}
          ${conv.nextAction ? `<div class="card nextact"><h4>Suggested next step</h4><p>${esc(conv.nextAction)}</p></div>` : ''}
        </div>
      </div>`;
  }
  function msgHtml(m) {
    if (m.from === 'sys') return `<div class="msg sys">${esc(m.text)}</div>`;
    if (m.from === 'typing') return '<div class="typing" aria-label="AI is typing"><i></i><i></i><i></i></div>';
    const who = m.from === 'cust' ? 'cust' : m.from;
    const label = m.from === 'cust' ? '' : m.from === 'ai' ? 'Rook AI · ' : 'Staff · ';
    return `<div class="msg ${who}">${esc(m.text)}
      ${m.cite ? `<br><span class="cite">📎 ${esc(m.cite)}</span>` : ''}
      <span class="meta">${label}${m.time ? fmtClock(m.time) : ''}</span></div>`;
  }

  // ---------- simulation ----------
  function runSimulation() {
    if (state.simRunning) return;
    state.simRunning = true;
    const sim = D.simulation;
    state.simConvo = {
      id: 'v-sim', name: sim.name, channel: sim.channel, customerLine: sim.customerLine,
      preview: 'Live — playing now…', time: D.merchant.now, unread: true,
      aiStatus: 'ai', score: 58, intent: 'Booking inquiry',
      fields: { Service: 'Brow Lamination', 'Date needed': 'Sun 12 Jul, 12:00 PM', Budget: '$88', Language: 'English', Urgency: 'Normal' },
      handoff: null,
      nextAction: 'None — booked automatically. Reminder scheduled Sat 6 PM.',
      messages: [],
    };
    state.convId = 'v-sim';
    state.mobilePane = 'thread';
    render();
    let i = 0;
    const step = () => {
      const s = sim.steps[i];
      if (!s) {
        state.simRunning = false;
        state.simConvo.preview = 'Booked · Sun 12 PM Brow Lamination';
        state.simConvo.score = 74;
        render();
        toast('Lead → booking in 41 seconds, fully automated');
        return;
      }
      i++;
      if (s.from === 'typing') {
        state.simConvo.messages.push({ from: 'typing' });
        render();
        setTimeout(() => {
          state.simConvo.messages = state.simConvo.messages.filter((m) => m.from !== 'typing');
          step();
        }, 1100);
        return;
      }
      setTimeout(() => {
        state.simConvo.messages.push({ from: s.from, text: s.text, cite: s.cite, time: D.merchant.now });
        render();
        step();
      }, s.delay);
    };
    step();
  }

  function lineChart() {
    const W = 460, H = 190, L = 26, R = 8, T = 26, B = 22;
    const data = D.metrics;
    const maxY = Math.max(...data.map((d) => d.leads)) + 1;
    const x = (i) => L + (i / (data.length - 1)) * (W - L - R);
    const y = (v) => T + (1 - v / maxY) * (H - T - B);
    const path = (key) => data.map((d, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(d[key]).toFixed(1)}`).join('');
    const grid = [0, Math.round(maxY / 2), maxY].map((v) => `
      <line class="grid-line" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/>
      <text x="${L - 5}" y="${y(v) + 3.5}" text-anchor="end">${v}</text>`).join('');
    const last = data[data.length - 1];
    const ticks = [0, 9, 19, 29].map((i) => `<text x="${x(i)}" y="${H - 6}" text-anchor="middle">${data[i].date.slice(5).replace('-', '/')}</text>`).join('');
    return `
      <svg class="viz" viewBox="0 0 ${W} ${H}" id="linechart" data-max="${maxY}">
        ${grid}
        <line class="axis" x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}"/>
        ${ticks}
        <path d="${path('leads')}" fill="none" stroke="var(--chart-1)" stroke-width="2"/>
        <path d="${path('bookings')}" fill="none" stroke="#1baf7a" stroke-width="2"/>
        <circle cx="${x(data.length - 1)}" cy="${y(last.leads)}" r="3.5" fill="var(--chart-1)"/>
        <circle cx="${x(data.length - 1)}" cy="${y(last.bookings)}" r="3.5" fill="#1baf7a"/>
        <text class="val" x="${x(data.length - 1) - 8}" y="${y(last.leads) - 8}" text-anchor="end" fill="var(--chart-1)">Leads</text>
        <text class="val" x="${x(data.length - 1) - 8}" y="${y(last.bookings) + 14}" text-anchor="end" fill="#1baf7a">Bookings</text>
        <line id="xhair" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="var(--chart-axis)" stroke-width="1" style="display:none"/>
        <rect x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent" id="linehit"/>
      </svg>
      <div style="display:flex;gap:14px;font-size:11.5px;color:var(--muted)">
        <span><span class="dot" style="background:var(--chart-1)"></span> Leads</span>
        <span><span class="dot" style="background:#1baf7a"></span> Bookings</span>
      </div>`;
  }

  function funnelChart() {
    const W = 460, rowH = 30, gap = 6, L = 78, R = 46;
    const max = D.funnel[0].n;
    const colors = ['var(--funnel-1)', 'var(--funnel-2)', 'var(--funnel-3)', 'var(--funnel-4)', 'var(--funnel-5)'];
    const H = D.funnel.length * (rowH + gap) + 4;
    return `<svg class="viz" viewBox="0 0 ${W} ${H}">
      ${D.funnel.map((f, i) => {
        const w = Math.max(6, (f.n / max) * (W - L - R));
        const yy = i * (rowH + gap);
        const conv = i > 0 ? Math.round((f.n / D.funnel[i - 1].n) * 100) + '%' : '';
        return `
          <text x="${L - 8}" y="${yy + rowH / 2 + 3.5}" text-anchor="end">${f.stage}</text>
          <rect x="${L}" y="${yy}" width="${w}" height="${rowH - 8}" rx="4" fill="${colors[i]}" data-tip="${f.stage}: ${f.n}${conv ? ' · ' + conv + ' of previous' : ''}"/>
          <text class="val" x="${L + w + 7}" y="${yy + rowH / 2 - 1}">${f.n}</text>
          ${conv ? `<text x="${L + w + 7}" y="${yy + rowH / 2 + 11}" font-size="9.5">${conv} →</text>` : ''}`;
      }).join('')}
    </svg>`;
  }

  function channelChart() {
    const W = 460, rowH = 30, gap = 6, L = 88, R = 92;
    const max = Math.max(...D.channels.map((c) => c.leads));
    const H = D.channels.length * (rowH + gap) + 4;
    return `<svg class="viz" viewBox="0 0 ${W} ${H}">
      ${D.channels.map((c, i) => {
        const yy = i * (rowH + gap);
        const wAll = (c.leads / max) * (W - L - R);
        const wBook = (c.booked / max) * (W - L - R);
        const rate = Math.round((c.booked / c.leads) * 100);
        return `
          <text x="${L - 8}" y="${yy + rowH / 2 + 3.5}" text-anchor="end">${c.name}</text>
          <rect x="${L}" y="${yy}" width="${wAll}" height="${rowH - 8}" rx="4" fill="var(--funnel-1)" data-tip="${c.name}: ${c.leads} leads"/>
          <rect x="${L}" y="${yy}" width="${wBook}" height="${rowH - 8}" rx="4" fill="var(--funnel-4)" data-tip="${c.name}: ${c.booked} booked (${rate}%)"/>
          <text class="val" x="${L + wAll + 7}" y="${yy + rowH / 2 + 3.5}">${c.booked}/${c.leads} · ${rate}%</text>`;
      }).join('')}
    </svg>`;
  }

  function forecastChart() {
    const W = 460, H = 170, L = 26, R = 10, T = 14, B = 24;
    const data = D.forecast;
    const maxY = 14;
    const x = (i) => L + (i / (data.length - 1)) * (W - L - R);
    const y = (v) => T + (1 - v / maxY) * (H - T - B);
    const band = data.map((d, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(d.hi).toFixed(1)}`).join('') +
      data.slice().reverse().map((d, i) => `L${x(data.length - 1 - i).toFixed(1)},${y(d.lo).toFixed(1)}`).join('') + 'Z';
    const mid = data.map((d, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(d.mid).toFixed(1)}`).join('');
    return `<svg class="viz" viewBox="0 0 ${W} ${H}">
      ${[0, 7, 14].map((v) => `<line class="grid-line" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 5}" y="${y(v) + 3.5}" text-anchor="end">${v}</text>`).join('')}
      <path d="${band}" fill="var(--chart-1)" opacity="0.16"/>
      <path d="${mid}" fill="none" stroke="var(--chart-1)" stroke-width="2"/>
      ${data.map((d, i) => `
        <circle cx="${x(i)}" cy="${y(d.mid)}" r="3.2" fill="var(--chart-1)" data-tip="${d.day}: ${d.mid} bookings (${d.lo}–${d.hi})"/>
        <text x="${x(i)}" y="${H - 7}" text-anchor="middle">${d.day.split(' ')[0]}</text>`).join('')}
      <text class="val" x="${x(0) + 4}" y="${y(data[0].mid) - 10}">Sat is your peak — 2 stylists booked out by noon</text>
    </svg>`;
  }

  function servicesChart() {
    const W = 460, rowH = 30, gap = 6, L = 118, R = 116;
    const max = Math.max(...D.topServices.map((s) => s.revenue));
    const H = D.topServices.length * (rowH + gap) + 4;
    return `<svg class="viz" viewBox="0 0 ${W} ${H}">
      ${D.topServices.map((s, i) => {
        const yy = i * (rowH + gap);
        const w = (s.revenue / max) * (W - L - R);
        return `
          <text x="${L - 8}" y="${yy + rowH / 2 + 3.5}" text-anchor="end">${s.name}</text>
          <rect x="${L}" y="${yy}" width="${w}" height="${rowH - 8}" rx="4" fill="var(--chart-1)" data-tip="${s.name}: ${money(s.revenue)} from ${s.bookings} bookings"/>
          <text class="val" x="${L + w + 7}" y="${yy + rowH / 2 + 3.5}">${money(s.revenue)} · ${s.bookings} bkgs</text>`;
      }).join('')}
    </svg>`;
  }

  // ---------- events ----------
  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-nav],[data-conv],[data-open-conv],[data-takeover],[data-simulate],[data-approve],[data-hold],[data-approve-camp],[data-post-reply],[data-filter],[data-cust],[data-back-cust],[data-back],[data-toast]');
    if (!t) return;
    if (t.dataset.nav) { state.view = t.dataset.nav; state.custId = null; state.mobilePane = 'list'; render(); window.scrollTo(0, 0); }
    else if (t.dataset.conv) { state.convId = t.dataset.conv; state.mobilePane = 'thread'; render(); }
    else if (t.dataset.openConv) { state.view = 'inbox'; state.convId = t.dataset.openConv; state.mobilePane = 'thread'; render(); window.scrollTo(0, 0); }
    else if (t.dataset.back !== undefined && t.dataset.back === '') { state.mobilePane = 'list'; render(); }
    else if (t.dataset.takeover) {
      const id = t.dataset.takeover;
      const c = getConv(id);
      state.aiPaused[id] = !state.aiPaused[id];
      c.messages.push({ from: 'sys', text: state.aiPaused[id] ? 'You took over — AI paused on this thread. It will keep logging and suggest replies.' : 'Handed back to AI — it has the full context of your messages.' });
      toast(state.aiPaused[id] ? 'AI paused — the thread is yours' : 'AI resumed on this thread');
      render();
    }
    else if (t.dataset.simulate !== undefined) runSimulation();
    else if (t.dataset.approve) {
      const a = D.approvals.find((x) => x.id === t.dataset.approve);
      state.done[a.id] = true;
      if (a.ref === 'mk-rain') state.campaign['mk-rain'] = 'scheduled';
      if (a.ref === 'rv-dana') state.reviewPosted['rv-dana'] = true;
      toast({
        'ap-campaign': 'Campaign approved — sending Sat 10:00 AM to 84 customers',
        'ap-review': 'Reply posted to Google',
        'ap-price': 'Price list v13 is live — AI will quote new prices immediately',
        'ap-merge': 'Profiles merged — history from both channels kept',
      }[a.id] || 'Approved');
      render();
    }
    else if (t.dataset.hold) { state.done[t.dataset.hold] = true; toast('Held — moved to your review list for later'); render(); }
    else if (t.dataset.approveCamp) {
      state.campaign[t.dataset.approveCamp] = 'scheduled';
      state.done['ap-campaign'] = true;
      toast('Campaign approved — sending Sat 10:00 AM to 84 customers');
      render();
    }
    else if (t.dataset.postReply) { state.reviewPosted[t.dataset.postReply] = true; state.done['ap-review'] = true; toast('Reply posted to Google'); render(); }
    else if (t.dataset.filter) { state.custFilter = t.dataset.filter; render(); }
    else if (t.dataset.cust) { state.custId = t.dataset.cust; render(); window.scrollTo(0, 0); }
    else if (t.dataset.backCust !== undefined) { state.custId = null; render(); }
    else if (t.dataset.toast) toast(t.dataset.toast);
  });

  // ---------- chart hover ----------
  const tip = $('#tooltip');
  function bindHover() {
    document.querySelectorAll('[data-tip]').forEach((el) => {
      el.addEventListener('mousemove', (e) => {
        tip.textContent = el.dataset.tip;
        tip.style.display = 'block';
        tip.style.left = e.clientX + 'px';
        tip.style.top = e.clientY + 'px';
      });
      el.addEventListener('mouseleave', () => { tip.style.display = 'none'; });
    });
    const hit = $('#linehit');
    if (hit) {
      const svg = $('#linechart');
      const xh = svg.querySelector('#xhair');
      const data = D.metrics;
      const L = 26, R = 8, W = 460;
      hit.addEventListener('mousemove', (e) => {
        const r = svg.getBoundingClientRect();
        const px = ((e.clientX - r.left) / r.width) * W;
        const i = Math.max(0, Math.min(data.length - 1, Math.round(((px - L) / (W - L - R)) * (data.length - 1))));
        const xx = L + (i / (data.length - 1)) * (W - L - R);
        xh.setAttribute('x1', xx); xh.setAttribute('x2', xx);
        xh.style.display = 'block';
        const d = data[i];
        tip.textContent = `${d.date.slice(5).replace('-', '/')} — ${d.leads} leads · ${d.bookings} bookings`;
        tip.style.display = 'block';
        tip.style.left = e.clientX + 'px';
        tip.style.top = e.clientY + 'px';
      });
      hit.addEventListener('mouseleave', () => { xh.style.display = 'none'; tip.style.display = 'none'; });
    }
  }

  render();
})();

</script>
